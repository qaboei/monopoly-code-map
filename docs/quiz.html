    private Player owner;

    public PropertySquare(String name, String color, int price, int rent) {
        super(name);
        this.color = color;
        this.price = price;
        this.rent = rent;
        this.owner = null;

    public void land(Game game, Player player) {
        if (owner == null) {
            // Unowned. Only offer it when the player can pay, so buying can
            // never cause a bankruptcy.
            if (player.getCash() >= price && game.wantsToBuy(player, this)) {

                // its owner and the owner's list holds the square.
                owner = player;
                player.addOwned(this);
                game.logBuy(player, this);

            // Owned by someone else. The lap for the color group starts at the
            // node the player is standing on, which holds this square.
            Node<Square> here = player.getPosition();
            int due = rent;
            if (game.getBoard().ownsGroup(here, here, color, owner)) {
                due = rent * 2;
            }
            // Game moves the money, so bankruptcy is decided in one place and
            // the RENT line is logged there. Jail does not stop rent (rule 3.4).
            game.payRent(player, owner, due);
        }
        // owner == player: nothing happens. Comparing references is constant
        // time; owned.contains(this) would be a hidden loop.
    }

    public String getType() {
        return "PROPERTY";
    }

    @Override
    public int getPrice() {
        return price;
    }

    public String getColor() {
        return color;
    }

    public int getRent() {
        return rent;

    public Player getOwner() {
        return owner;
    }

    public void setOwner(Player owner) {
        this.owner = owner;
    }

 * One square of the board (brief Section 5): a name and a landing rule.
 *
 * The five subclasses sit directly under this class, exactly as Section 5
 * draws them. Game never asks "which kind of square is this?"; it calls land()
 * and the subclass applies its own rule.
 */
public abstract class Square {

    // Unique on the board (Appendix B). Board.findByName compares it, and
    // every MOVE, BUY and RENT log line prints it.
    private String name;

    protected Square(String name) {
        this.name = name;
    }

    public String getName() {
        return name;
    }

    /**
     * Applies this square's rule to the player standing on it.
     * Called only by Game.landOn. Fixed by the brief.
     *
     * landOn is one of the mandatory recursive methods, so no land() body may
     * contain a loop: everything it does is constant time or recursive.
     */
    public abstract void land(Game game, Player player);

    /**
     * The type word used in the board file: GO, PROPERTY, TRANSIT, TAX,
     * CHANCE, COMMUNITY, JAIL, FREE or GO_TO_JAIL.
     * Board.findNearest compares this String, as its signature requires, so no
     * class outside the hierarchy needs instanceof.
     */
    public abstract String getType();

    /**
     * Purchase price. 0 for every square that cannot be bought; only
     * PropertySquare and TransitSquare override it. This lets Player.netWorth
     * add up a list of Square without casting.
     */
    public int getPrice() {
        return 0;
    }
}`},{name:"TaxSquare",file:"TaxSquare.java",lines:30,role:"Pay a fixed amount to the bank.",group:"square",extends:"Square",abstract:!1,fields:[{name:"amount",type:"int",vis:"private",static:!1,doc:"",value:""}],methods:[{name:"TaxSquare",key:"TaxSquare.TaxSquare",ctor:!0,sig:"public TaxSquare(String name, int amount)",vis:"public",static:!1,abstract:!1,returns:"",params:"String name, int amount",doc:"",line:9,end:12,code:`public TaxSquare(String name, int amount) {

public class TaxSquare extends Square {

    private int amount;

    public TaxSquare(String name, int amount) {
        super(name);
        this.amount = amount;
    }

    @Override
    public void land(Game game, Player player) {
        // The square only says how much. Game moves the money, because a tax
        // the player cannot afford is a bankruptcy with the bank as creditor.
        game.payTax(player, amount);
    }

    @Override
    public String getType() {
        return "TAX";
    }

    public int getAmount() {
        return amount;
    }

/**
 * A TRANSIT square: price, owner (brief Section 5).
 * Same three cases as a property, but rent = 25 x 2^(n - 1), where n is the
 * number of TRANSIT squares the owner holds (rule 3.2).
 */
public class TransitSquare extends Square {

    private int price;

    // null means the bank holds it.
    private Player owner;

    public TransitSquare(String name, int price) {
        super(name);
        this.price = price;
        this.owner = null;
    }

    @Override
    public void land(Game game, Player player) {
        if (owner == null) {
            if (player.getCash() >= price && game.wantsToBuy(player, this)) {
                player.addCash(-price);
                owner = player;
                player.addOwned(this);
                game.logBuy(player, this);
            }
        } else if (owner != player) {
            // n is at least 1 here, because the owner holds this square.
            int n = countTransit(owner.getOwned(), 0);
            game.payRent(player, owner, transitRent(n));
        }
    }

    /**
     * Mandatory recursive method (brief 5.1): returns 25 x 2^(owned - 1).
     * Base case: owned is 1 (or less), the rent is 25.
     * Recursive case: twice the rent for one fewer square.
     * Stops because owned drops by 1 each call until it reaches 1.
     */
    public int transitRent(int owned) {
        // "<= 1" and not "== 1": a call with 0 or a negative number would
        // otherwise never reach the base case.
        if (owned <= 1) {
            return 25;
        }
        return 2 * transitRent(owned - 1);
    }

    // Suggested helper. Counts the TRANSIT squares in a list from index to the
    // end. It is recursive because land() is reached from landOn, where loops
    // are not allowed. get(index) on an ArrayList is constant time.
    private int countTransit(ArrayList<Square> owned, int index) {
        if (index == owned.size()) {
            return 0;
        }
        int here = 0;
        if (owned.get(index).getType().equals("TRANSIT")) {
            here = 1;
        }
        return here + countTransit(owned, index + 1);
    }

    @Override
    public String getType() {
        return "TRANSIT";
    }

    @Override
    public int getPrice() {
        return price;
    }

    public Player getOwner() {
        return owner;
    }

    public void setOwner(Player owner) {
        this.owner = owner;
    }
}`}],links:[{from:"Board",to:"CardSquare",ext:!1,fields:[],calls:[["Board.makeSquare","CardSquare.CardSquare"]],creates:!0,mentions:!0},{from:"Board",to:"CircularDoublyLinkedList",ext:!1,fields:["squares"],calls:[["Board.Board","CircularDoublyLinkedList.size"],["Board.Board","CircularDoublyLinkedList.getHead"],["Board.Board","CircularDoublyLinkedList.addLast"],["Board.readExpansion","CircularDoublyLinkedList.getHead"],["Board.readExpansion","CircularDoublyLinkedList.size"],["Board.applyNextExpansion","CircularDoublyLinkedList.size"],["Board.applyNextExpansion","CircularDoublyLinkedList.insertAfter"],["Board.size","CircularDoublyLinkedList.size"]],creates:!1,mentions:!0},{from:"Board",to:"CornerSquare",ext:!1,fields:[],calls:[["Board.makeSquare","CornerSquare.CornerSquare"]],creates:!0,mentions:!0},{from:"Board",to:"LinkedQueue",ext:!1,fields:["expandSquares","expandAfter"],calls:[["Board.Board","LinkedQueue.isEmpty"],["Board.readExpansion","LinkedQueue.enqueue"],["Board.isPending","LinkedQueue.size"],["Board.isPending","LinkedQueue.dequeue"],["Board.isPending","LinkedQueue.enqueue"],["Board.hasExpansion","LinkedQueue.isEmpty"],["Board.applyNextExpansion","LinkedQueue.dequeue"]],creates:!1,mentions:!0},{from:"Board",to:"Node",ext:!1,fields:["goNode","jailNode"],calls:[],creates:!1,mentions:!0},{from:"Board",to:"Player",ext:!1,fields:[],calls:[["Board.step","Player.addCash"]],creates:!1,mentions:!0},{from:"Board",to:"PropertySquare",ext:!1,fields:[],calls:[["Board.makeSquare","PropertySquare.PropertySquare"],["Board.ownsGroup","PropertySquare.getColor"],["Board.ownsGroup","PropertySquare.getOwner"]],creates:!0,mentions:!0},{from:"Board",to:"Square",ext:!1,fields:["squares","goNode","jailNode","expandSquares"],calls:[["Board.Board","Square.getName"],["Board.readExpansion","Square.getName"],["Board.isPending","Square.getName"],["Board.applyNextExpansion","Square.getName"],["Board.ownsGroup","Square.getType"],["Board.findByName","Square.getName"],["Board.findNearest","Sq fter.prev = added","Add 1 to size"],why:"Once node.next is overwritten there is no other way to reach the old neighbour without walking the ring.",code:"CircularDoublyLinkedList.insertAfter"},{t:"structures",l:"ring",q:"How many link writes does insertAfter make to splice the new node in?",a:["4","2","3","6"],why:"added.prev, added.next, node.next, after.prev. The first two touch only the new node, so the ring is never broken."},{t:"structures",l:"ring",q:"A list holds exactly one node. What is its next?",a:["The node itself","null","Nothing until a second node is added","The JAIL node"],why:"The first node is its own neighbour in both directions, so even one square is a ring and step never meets a null link."},{t:"structures",l:"ring",q:"Which rule does every list method keep true for every node n?",a:["n.next.prev == n and n.prev.next == n","n.next == n.prev","head.next == head","n.next is null only at the tail"],why:"That is the ring rule. There is no null link inside the ring at all."},{t:"structures",l:"ring",q:"What is the strongest reason the board is a linked ring and not an ArrayList?",a:["It is circular, moves go both ways, and a square can be inserted mid-game without fixing any position","get(i) is faster on a linked list","A linked list uses less memory","Java does not allow an ArrayList of squares"],why:"No % size, prev for backward moves, and T3 inserts with four pointer writes while every position stays a valid node reference."},{t:"structures",l:"ring",q:"How is a player's position stored?",a:["As a Node<Square> reference","As an int index into the board","As the name of the square","As an index kept in range with % size"],why:"Rule 4.2 bans indices and % size for movement. The square is position.data."},{t:"structures",l:"queue",q:"What is LinkedQueue built on?",a:["Its own private node with one link, next","The board's Node<T>, ignoring prev","java.util.LinkedList","An ArrayList"],why:"The brief asks for singly linked nodes. A private QNode has data and next only, and nothing outside can relink it."},{t:"structures",l:"queue",q:"What happens when dequeue() is called on an empty queue?",a:["It throws IllegalStateException with a clear message","It returns null","It returns -1","It waits until something is enqueued"],why:"Rule 4.1 requires an exception. Returning null would hide the bug until later.",code:"LinkedQueue.dequeue"},{t:"structures",l:"queue",q:"dequeue() has just removed the last element. What else must it do?",a:["Set rear to null","Set front to rear","Set size to 1","Nothing more"],why:"Otherwise the next enqueue would link the new node behind a node that is no longer in the queue, and front would stay null."},{t:"structures",l:"queue",q:"enqueue() is called on an empty queue. Which references does it set?",a:["Both front and rear","Only rear","Only front","Neither, only size"],why:"The one node is both first and last. Forgetting front would make the element unreachable by dequeue."},{t:"structures",l:"five",q:"Why are a player's owned squares an ArrayList?",a:["netWorth reads them by index, and get(i) is one step","An ArrayList can be shuffled","Inserting in the middle is faster","The brief bans queues for players"],why:"netWorth(owned, index) reads square index then calls itself with index + 1. In a linked list each read would walk from the start."},{t:"structures",l:"five",q:"Which of these is NOT stored in an ArrayList?",a:["The turn order","A player's owned squares","All players, for the final ranking","The cards before shuffling"],why:"The turn order is our own LinkedQueue. The other three are the ArrayList roles the brief lists."},{t:"structures",l:"queue",q:"Which java.util classes may the program use?",a:["ArrayList, Scanner, Random and Collections","Those four plus LinkedList","Those four plus HashMap","Any class in java.util"],why:"Rule 4.2. The list and the queue must be our own."},{t:"design",l:"queue",q:"Which methods are allowed to write a player's position?",a:["Game.moveBy and Ga layer has, so a balance never goes below 0.",code:"Game.transfer"},{t:"design",l:"money",q:"Why does transfer return the amount instead of calling goBankrupt itself?",a:["So the caller can print its payment line before BANKRUPT","Because returning is faster","Because goBankrupt is static","To avoid recursion"],why:"Appendix C: the payment line shows the amount actually paid, then BANKRUPT follows."},{t:"design",l:"landon",q:"When and where are the cards shuffled?",a:["Once, in an ArrayList at load time, before moving into the queue","In the queue, before every draw","Never","At the start of every turn"],why:"A queue cannot be shuffled: it only reaches its front. Collections.shuffle runs once on the list."},{t:"design",l:"landon",q:'What is "drawing a card" in the code?',a:["dequeue from the front, and enqueue at the back after applying it","peek at the front and leave it there","Remove a random card","Take the card from the back"],why:"A deck is a LinkedQueue<Card>. Draw is dequeue, return is enqueue."},{t:"design",l:"landon",q:"What happens to a JAIL_FREE card when it is drawn?",a:["It stays with the player, and returns to the back of its own deck when used","It goes straight to the back of the deck","It is removed from the game","It goes to the bank"],why:"drawCard returns before the enqueue. The card remembers its deck so it can find its way back."},{t:"design",l:"queue",q:"During a player’s own turn, where are they in the turn queue?",a:["Nowhere: they were dequeued when the turn started","At the front","At the back","In place, but marked as playing"],why:"playTurn dequeues first and enqueues last. That is why REVERSE does not include the current player."},{t:"design",l:"queue",q:"Which class prints the log lines?",a:["GameLogger only","Each class prints its own","Main","Board"],why:"One method per kind of line, so the format lives in one place."},{t:"design",l:"queue",q:"What does running with the same seed give?",a:["The same dice and the same card order, so the same game","The same player names","A faster game","Nothing: the game is always random"],why:"The dice and both shuffles use Random with that seed."},{t:"design",l:"queue",q:"When is a player offered a square to buy?",a:["When it is unowned and they have at least its price","Always, on any unowned square","Only after a double","Only when the bank allows it"],why:"cash >= price is tested first, so buying can never cause a bankruptcy."},{t:"design",l:"five",q:"When is the rent of a property doubled?",a:["When the owner holds every property of that color","When the owner holds any two properties","When the payer rolled a double","After turn 20"],why:"PropertySquare.land calls Board.ownsGroup, which walks once around the ring."},{t:"design",l:"last",q:"Why do squares ask Game to move the money?",a:["A payment can end in bankruptcy, which touches things a square cannot see","Squares cannot do arithmetic","Game is faster","To save memory"],why:"Bankruptcy touches the player’s other squares, the decks, the queue and the log."},{t:"recursion",l:"step",q:"What is the base case of step()?",a:["steps == 0: return the current node","current == goNode","steps < 0","p == null"],why:"Nothing moves and nothing is paid. Every call moves steps one closer to 0.",code:"Board.step"},{t:"recursion",l:"step",q:"What does step() do with a negative number of steps?",a:["Follows prev, adds 1 to steps each call, and never pays a salary","Returns the current node at once","Throws an exception","Follows next, as for a positive number"],why:"The backward line has no salary test at all."},{t:"recursion",l:"step",q:"A player standing on GO moves 3 squares forward. Is a salary paid?",a:["No: the test is on the node stepped onto","Yes, 200","Yes, 400","Only if the roll was a double"],why:"next == goNode is tested before each step. Stepping off GO does not match."},{t:"recursion",l:"step",q:"From Luxury Tax, two squares before GO, a player moves 5 forward. How many salaries?",a:["1","0","2","5"],why:"The second step lands on GO. One move can never pass GO twice on a board of 20 or more squares."},{t:"recursion",l:"taketurn",q:"What is the largest number of takeTurn calls in one turn?",a:["3","2","No limit","6"],why:"doublesCount goes 0, 1, 2, and a double at 2 goes to Jail."},{t:"recursion",l:"taketurn",q:"takeTurn(p, 2) rolls a double. What happens?",a:["The player goes to Jail without moving","The player moves, then goes to Jail","The player rolls a fourth time","Nothing special"],why:"if (wasDouble && doublesCount == 2) runs before moveBy. The log shows ROLL then JAIL, no MOVE.",code:"Game.takeTurn"},{t:"recursion",l:"taketurn",q:"A player rolls a double and lands on Go To Jail. Do they roll again?",a:["No: the recursive call needs the player to be out of Jail","Yes, a double always gives another roll","Yes, but from Jail","Only with a JAIL_FREE card"],why:"if (wasDouble && !p.isInJail() && !p.isBankrupt()). Being sent to Jail ends the turn."},{t:"recursion",l:"landon",q:"When does landOn call itself?",a:["A card moved the player, who is free and solvent, and fewer than 10 card moves have followed","After every landing","After a double","Whenever any card is drawn"],why:"All four conditions of the guard must be true.",code:"Game.landOn"},{t:"recursion",l:"landon",q:"Without its limit, what could make landOn recurse forever?",a:["Two cards that send the player to each other’s card squares","Three doubles in a row","The board expansion","A reversed queue"],why:"Cards return to their decks, so a deck never runs out and nothing would stop the bouncing."},{t:"recursion",l:"landon",q:"What is MAX_CARD_CHAIN?",a:["10","3","60","20"],why:"At most 10 card moves can follow one landing, so one landing causes at most 11 landOn calls."},{t:"recursion",l:"landon",q:"A MOVE_BY 0 card is drawn. What does drawCard do?",a:["Does not move the player and does not set the cardMoved note","Moves 0 squares and sets the note","Throws an exception","Draws another card"],why:"Setting the note would make landOn resolve the same card square again, and draw again."},{t:"recursion",l:"five",q:"What does transitRent(3) return?",a:["100","75","50","200"],why:"2 × transitRent(2) = 2 × 2 × transitRent(1) = 2 × 2 × 25.",code:"TransitSquare.transitRent"},{t:"recursion",l:"five",q:'Why is the base case of transitRent "owned <= 1" and not "owned == 1"?',a:["So a call with 0 or less still stops","It runs faster","So no transit means no rent","Java requires <="],why:"With == 1, a call with 0 would go to -1, -2 and never reach the base case."},{t:"recursion",l:"five",q:"What is the base case of netWorth(owned, index)?",a:["index >= owned.size(): return 0","The list is empty","index == 0","cash == 0"],why:"index rises by 1 each call until it is past the end of the list.",code:"Player.netWorth"},{t:"recursion",l:"five",q:"netWorth adds up the prices. Who adds the cash?",a:["The caller, Game.worth","netWorth, in its base case","Player.getCash, automatically","GameLogger"],why:'The brief says "the caller adds cash". worth is p.getCash() + p.netWorth(p.getOwned(), 0).'},{t:"recursion",l:"five",q:"In ownsGroup, when is the lap around the board finished?",a:["When current.next == start","When current == start","When remaining == 0","When current == goNode"],why:"Each call moves one node forward, so the start comes round again.",code:"Board.ownsGroup"},{t:"recursion",l:"five",q:"Why does ownsGroup test current.next == start, not current == start?",a:["On the first call current is start, so it would stop before checking anything","It is faster","next is never null","GO is a special case"],why:"The first call passes the same node for both."},{t:"recursion",l:"five",q:'What is the "remaining" parameter of findByName for?',a:["A ring has no end, so it stops the search for a name that is not there","It counts the salary","It makes the search faster","It is not used"],why:"It starts at the board size and drops by 1. At 0 the method returns null."},{t:"recursion",l:"five",q:"Which node does findNearest test on each call?",a:["current.next, the node ahead","current","current.prev","The head"],why:'"Nearest" means the next square of that type moving forward, never the one under the player.',code:"Board.findNearest"},{t:"recursion",l:"five",q:"What must be true of every helper the eight required methods call?",a:["It is recursive or runs in constant time","It is static","It is private","It may loop if the loop is short"],why:"Section 5.1. That is why payEach, releaseSquares and the others are recursive too."},{t:"recursion",l:"five",q:"Why does Player.resetOwned create a new list instead of calling clear()?",a:["clear() loops inside the library, and this is reached from landOn","clear() is slower","clear() is banned in Java","To keep a history of old lists"],why:"A hidden loop is still a loop. A new empty list is one step."},{t:"recursion",l:"five",q:"Where does the program contain loops?",a:["File loading, Main’s input, Game.play and the ranking","takeTurn","landOn","step"],why:"None of those is called from a required recursive method."},{t:"recursion",l:"step",q:"For any recursive method, which three things should you be able to point at?",a:["Base case, recursive case, and what changes so it must stop","Its loop, its counter and its exit","Its fields, its constructor and its getter","Its caller, its class and its file"],why:"The design document must state exactly these for each required method."},{t:"scenarios",l:"step",q:'Two before GO, roll 5, land on Chance: "Go back 3 squares". Where does the player end, and how many salaries?',a:["On GO, one salary","On GO, two salaries","Before GO, no salary","On GO, no salary"],why:"One for passing GO forward. Landing on GO backward pays nothing."},{t:"scenarios",l:"money",q:"Sara owes 300 in rent and has 120. What amount does the RENT line show?",a:["120","300","0","180"],why:"The payment line shows the amount actually paid. BANKRUPT follows it."},{t:"scenarios",l:"money",q:"Sara goes bankrupt. What happens to her squares?",a:["Their owner becomes null: back with the bank","They go to the creditor","They stay hers","They are removed from the board"],why:"releaseSquares sets owner = null on each one, so they can be bought again."},{t:"scenarios",l:"money",q:"Sara goes bankrupt holding a JAIL_FREE card. Where does it go?",a:["To the back of the deck it came from","To the creditor","It is destroyed","To the front of its deck"],why:"returnJailFreeCards enqueues it on getDeck(card.getDeck())."},{t:"scenarios",l:"money",q:"The current player goes bankrupt. What happens to the turn queue?",a:["Nothing is removed: the player is just not enqueued again","The player is removed from the middle","The queue is rebuilt","The queue is reversed"],why:"The current player is not in the queue. playTurn skips the enqueue for a bankrupt player."},{t:"scenarios",l:"money",q:"Sara draws COLLECT_EACH 10. The queue is Omar (5 AED), then Ali. What is the queue right after the card?",a:["Ali","Omar, Ali","Ali, Omar","Empty"],why:"Omar pays 5, is bankrupt and is not enqueued again. Ali pays 10 and goes to the back."},{t:"scenarios",l:"money",q:"In that case, what are the log lines for Omar’s payment, in order?",a:["CASH|Omar|-5, CASH|Sara|5, then BANKRUPT|Omar|Sara","BANKRUPT first, then the two CASH lines","CASH|Omar|-10, CASH|Sara|10","Only BANKRUPT|Omar|Sara"],why:"Two CASH lines per transfer, payer first, showing the amount actually paid. Then BANKRUPT."},{t:"scenarios",l:"jail",q:"Third failed Jail roll, 30 AED in cash. What happens?",a:["Pays 30 to the bank, is bankrupt, does not move","Pays 30 and moves by the roll","Stays in Jail for another turn","Pays 50 and has -20"],why:"payBank pays what the player has. jailTurn returns at once for a bankrupt player."},{t:"scenarios",l:"jail",q:"A jailed player rolls a double. What happens?",a:["Released, moves by the roll, and gets no extra roll","Released and rolls again","Stays in Jail","Pays 50 and moves"],why:"jailTurn calls moveBy and landOn directly, not takeTurn, so the double earns no extra roll."},{t:"scenarios",l:"jail",q:"What does jailTurn check first?",a:["Whether the player holds a JAIL_FREE card","The dice","Whether the player can pay 50","The number of failed attempts"],why:"A card is used first. It returns to its deck and the player takes a normal turn.",code:"Game.jailTurn"},{t:"scenarios",l:"taketurn",q:"What does the log show for a third double?",a:["ROLL then JAIL, with no MOVE","MOVE then JAIL","Only JAIL","ROLL, MOVE, JAIL"],why:"Appendix C.1: on the third double, ROLL is followed directly by JAIL."},{t:"scenarios",l:"jail",q:"A square’s owner is in Jail. Someone lands on it. What happens?",a:["Rent is paid as usual","No rent","Half rent","The rent goes to the bank"],why:"Rule 3.4. land only checks who the owner is."},{t:"scenarios",l:"jail",q:"A player is sent to Jail from a square just before GO. Is a salary paid?",a:["No: the JAIL node is assigned directly, with no walk","Yes, 200","Only for a forward move","Only if a card sent them"],why:"sendToJail never calls step, so the salary test never runs."},{t:"scenarios",l:"five",q:"Two active players have the same net worth at the end. Who ranks higher?",a:["The one who joined first","The one who joined last","Alphabetical order","They share the place"],why:"The ranking picks the richest with a strict >, over a list in join order."},{t:"scenarios",l:"five",q:"How are bankrupt players ranked?",a:["After the active players, most recent bankruptcy first, with net worth 0","First out, first ranked","By the cash they had","They are left out"],why:"rankBankrupt reads the bankruptcy queue recursively and prints on the way back."},{t:"scenarios",l:"five",q:"When is the end of the game checked?",a:["After each turn: one player left, or the turn count reached the limit","Before each roll","Only at turn 60","When the bank runs out"],why:"endReason tests LAST_PLAYER first, then MAX_TURNS (60 by default)."},{t:"scenarios",l:"landon",q:'A card says "Advance to GO". Is the salary paid?',a:["Yes: the player walks there through moveBy, so step pays it","No: cards never pay a salary","No: the player jumps to GO","Only if the player was past Jail"],why:"findByName finds the node, stepsForward counts the links, and moveBy walks them."},{t:"twists",l:"twists",q:"(T1) A draws REVERSE while the queue holds B, C, D. Who plays the next four turns?",a:["D, C, B, A","B, C, D, A","A, D, C, B","D, C, B, D"],why:"A is not in the queue, so B, C, D become D, C, B. A is enqueued at the back when the turn ends."},{t:"twists",l:"twists",q:"Which operations may reverse(q) use?",a:["Only enqueue, dequeue and isEmpty","A stack","An array","An ArrayList"],why:"Appendix A: no other list, array or stack may be used.",code:"Game.reverse"},{t:"twists",l:"twists",q:"Where does reverse(q) keep the elements while the queue is empty?",a:["In the local variable of each open call: the call stack","In an ArrayList","In a second queue","In an array"],why:"Each call holds one element and enqueues it after the calls below it return."},{t:"twists",l:"twists",q:"reverse(q) runs on B, C, D. Which element is enqueued first?",a:["D","B","C","None: they are swapped in place"],why:"The last element dequeued is the first put back, because the calls return in the opposite order."},{t:"twists",l:"twists",q:"(T7) RECALL is drawn and 7 other cards are in the deck. What is k in rotate(deck, k)?",a:["4","3","7","1"],why:"others - 3. Sending the first four to the back leaves the last three at the front.",code:"Game.rotate"},{t:"twists",l:"twists",q:"(T7) RECALL is drawn and only 3 other cards are in the deck. What happens?",a:["Nothing changes and no RECALL line is printed","The three cards are rotated anyway","An error","The deck is reshuffled"],why:"The rule applies only when more than 3 other cards are in the deck."},{t:"twists",l:"twists",q:"(T3) When are the EXPAND lines applied?",a:["At the end of turn 20, in file order","At the start of turn 20","Every 20 turns","When the board file is loaded"],why:"playTurn checks turnCount == 20 after the player has been enqueued."},{t:"twists",l:"twists",q:"(T3) Why does inserting a square move no player?",a:["A position is a node reference, and no existing node changes","Every index is recomputed","All players are reset to GO","Players are moved, by one square"],why:"insertAfter only changes the links of the two neighbours."},{t:"twists",l:"twists",q:"(T3) Hudayriyat Island is GREEN. A player owned both original green squares. After the expansion?",a:["They no longer hold the whole group, so rent is not doubled","Rent stays doubled","They lose their green squares","They receive the new square"],why:"ownsGroup walks the ring as it is now, and the new green square has no owner."},{t:"twists",l:"twists",q:"(T2) The instructor asks about the Earthquake. What is true of our program?",a:["T2 is not our twist; remove(node) exists and is tested, but the game never removes a square","Earthquake is fully implemented","T2 replaced T3","The program crashes on it"],why:"Our twists are T1, T3 and T7. remove is there because rule 4.1 requires it."},{t:"ai",l:"last",q:"What did the AI’s first LinkedQueue do on an empty dequeue()?",a:["Returned null","Threw an exception","Looped forever","Returned the last element"],why:"Rule 4.1 requires an exception with a clear message. It was changed to IllegalStateException and the tests were updated."},{t:"ai",l:"last",q:"What was wrong with the AI’s first findNearest?",a:["It tested the square the player was standing on","It used a loop","It never returned null","It searched backward"],why:"Section 5.1 says the next square moving forward. It now tests current.next."},{t:"ai",l:"last",q:"How was the landOn problem noticed?",a:["By reasoning: cards return to their decks, so nothing forced a chain to end","The compiler reported it","The instructor reported it","A deck ran out of cards"],why:"A MOVE_BY 0 card, or two cards pointing at each other,
