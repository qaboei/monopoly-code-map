    while (line != null) {
        line = line.trim();

            // for later.
            try {

            if (!expandSquares.isEmpty()) {
                in.close();
                throw new IllegalArgumentException("Board file: EXPAND lines must come after every square line.");
            }

            Square square = makeSquare(f);

            // Names must be unique (Appendix B): findByName returns the
            // first match, so a second square with the same name could
            // never be reached by a MOVE_TO card. The search reuses the
            // ring built so far; no extra collection is needed.

                throw new IllegalArgumentException("Board file has two squares named \\"" + square.getName() + "\\".");

            squares.addLast(square);

            // The node just added is the tail, which is head.prev.
            Node<Square> node = squares.getHead().prev;

import java.io.FileReader;
import java.io.IOException;

/**
 * The board (brief Section 5): CircularDoublyLinkedList<Square>, GO node, JAIL node.
 *
 * It owns the ring of squares and answers every question that needs walking
 * it. Four of the mandatory recursive methods live here: step, ownsGroup,
 * findByName and findNearest. None of them contains a loop.
 */
public final class Board {

    public static final int SALARY = 200; // rule 3.3

    // The ring itself: one node per square, last node linked back to GO.
    private CircularDoublyLinkedList<Square> squares;

    // Kept so step() can test "is the node I am stepping onto GO?" with one
    // reference comparison, and so new players can be placed on GO.
    private Node<Square> goNode;

    // Kept so sending a player to Jail is one assignment, with no search.
    private Node<Square> jailNode;

    // Twist T3: the EXPAND lines of the board file, waiting to be applied, in
    // file order. Two queues that always move together: the new square, and
    // the name of the existing square it goes after. Our own queue keeps the
    // file order (first in, first out) without another collection.
    private LinkedQueue<Square> expandSquares = new LinkedQueue<Square>();
    private LinkedQueue<String> expandAfter = new LinkedQueue<String>();

    /**
     * Loads the board file (Appendix B.1). The loop here is allowed: loading
     * runs once at setup and is not reached from any recursive method.
     */
    public Board(String fileName) throws IOException {
        squares = new CircularDoublyLinkedList<Square>();
        int goToJailCount = 0;

        BufferedReader in = new BufferedReader(new FileReader(fileName));
        String line = in.readLine();
        while (line != null) {
            line = line.trim();
            if (line.startsWith("EXPAND|")) {
                // Twist T3: not part of the starting board. Checked now, kept
                // for later.
                try {
                    readExpansion(line);
                } catch (IllegalArgumentException e) {
                    in.close();
                    throw e;
                }
            } else if (!line.isEmpty() && !line.startsWith("#")) {
                // Appendix B: EXPAND lines go at the END of the file.
                if (!expandSquares.isEmpty()) {
                    in.close();
                    throw new IllegalArgumentException("Board file: EXPAND lines must come after every square line.");
                }
                String[] f = line.split("\\\\|");
                Square square = makeSquare(f);

                // Names must be unique (Appendix B): findByName returns the
                // first match, so a second square with the same name could
                // never be reached by a MOVE_TO card. The search reuses the
                // ring built so far; no extra collection is needed.
                if (squares.size() > 0
                        && findByName(squares.getHead(), square.getName(), squares.size()) != null) {
                    in.close();
                    throw new IllegalArgumentException("Board file has two squares named \\"" + square.getName() + "\\".");
                }

                // File order is board order, so addLast keeps it.
                squares.addLast(square);

                // The node just added is the tail, which is head.prev.
                Node<Square> node = squares.getHead().prev;
                if (f[0].equals("GO")) {
                    if (goNode != null) {
                        in.close();
                        throw new IllegalArgumentException("Board file has more than one GO.");
                    }
                    goNode = node;
                } else if (f[0].equals("JAIL")) {
                    if (jailNode != null) {
                        in.close();
                        throw new IllegalArgumentException("Board file has more than one JAIL.");
                    }
                    jailNode = node;
                } else if (f[0].equals("GO_TO_JAIL")) {
                    goToJailCount++;
                }
            }
            line = in.readLine();
        }
        in.close();

        // Rule 3.1. The recursive methods rely on these facts: step() assumes
        // GO is the head, and one move can never pass GO twice on 20+ squares.
        if (goNode == null || goNode != squares.getHead()) {
            throw new IllegalArgumentException("Board file must start with the GO square.");
        }
        if (jailNode == null || goToJailCount != 1) {
            throw new IllegalArgumentException("Board file needs exactly one JAIL and one GO_TO_JAIL.");
        }
        if (squares.size() < 20 || squares.size() > 28) {
            throw new IllegalArgumentException("Board must have 20 to 28 squares, found " + squares.size() + ".");
        }
    }

    // Suggested helper: builds the right subclass for one line of the file.
    // This is the only place in the program that maps a type word to a class,
    // so a new square type means one new subclass and one new line here.
    private Square makeSquare(String[] f) {
        String type = f[0];
        String name = f[1];
        if (type.equals("PROPERTY")) {
            return new PropertySquare(name, f[2], Integer.parseInt(f[3].trim()), Integer.parseInt(f[4].trim()));
        }
        if (type.equals("TRANSIT")) {
            return new TransitSquare(name, Integer.parseInt(f[2].trim()));
        }
        if (type.equals("TAX")) {
            return new TaxSquare(name, Integer.parseInt(f[2].trim()));
        }
        if (type.equals("CHANCE") || type.equals("COMMUNITY")) {
            return new CardSquare(name, type);
        }
        if (type.equals("GO") || type.equals("JAIL") || type.equals("FREE") || type.equals("GO_TO_JAIL")) {
            return new CornerSquare(name, type);
        }
        throw new IllegalArgumentException("Unknown square type in board file: " + type);
    }

    // ------------------------------------------------------------ twist T3

    // One EXPAND line: EXPAND|<existing square>|<a full square definition>.
    // Everything that could go wrong is checked here, at setup, so applying
    // the expansion in the middle of a game can never fail.
    private void readExpansion(String line) {
        // Split into 3 parts only: the word EXPAND, the existing square's
        // name, and the rest, which is an ordinary square line.
        String[] parts = line.split("\\\\|", 3);
        if (parts.length < 3) {
            throw new IllegalArgumentException("EXPAND line needs an existing square and a square definition: " + line);
        }
        String after = parts[1];
        String[] f = parts[2].split("\\\\|");
        String type = f[0];
        if (type.equals("GO") || type.equals("JAIL") || type.equals("GO_TO_JAIL")) {
            // The board must keep exactly one of each (rule 3.1).
            throw new IllegalArgumentException("EXPAND cannot add a second " + type + " square.");
        }
        Square square = makeSquare(f);

        // The square to insert after must exist by the time this line is
        // applied: on the starting board, or added by an earlier EXPAND line.
        if (findByName(squares.getHead(), after, squares.size()) == null && !isPending(after)) {
            throw new IllegalArgumentException("EXPAND names a square that does not exist: \\"" + after + "\\".");
        }
        // Names stay unique after the expansion too.
        if (findByName(squares.getHead(), square.getName(), squares.size()) != null || isPending(square.getName())) {
            throw new IllegalArgumentException("Board file has two squares named \\"" + square.getName() + "\\".");
        }
        expandSquares.enqueue(square);
        expandAfter.enqueue(after);
    }

    // True if a waiting EXPAND square has this name. Used while loading only,
    // so the loop is allowed. Each square is dequeued and enqueued again, so
    // the queue ends in the same order.
    private boolean isPending(String name) {
        boolean found = false;
        int count = expandSquares.size();
        for (int i = 0; i < count; i++) {
            Square square = expandSquares.dequeue();
            if (square.getName().equals(name)) {
                found = true;
            }
            expandSquares.enqueue(square);
        }
        return found;
    }

    public boolean hasExpansion() {
        return !expandSquares.isEmpty();
    }

    /**
     * Applies the next EXPAND line, in file order: the new square is inserted
     * directly after the named existing square. No loop: one search (the
     * recursive findByName) and one insertAfter, which is four pointer writes.
     *
     * Returns {new square name, after square name} for the log line.
     *
     * Players are not moved: a position is a reference to a node, and
     * insertAfter changes no existing node's data, only the links of the two
     * neighbours. A player standing on the "after" square simply has a new
     * square ahead of them.
     */
    public String[] applyNextExpansion() {
        Square square = expandSquares.dequeue();
        String after = expandAfter.dequeue();
        Node<Square> node = findByName(goNode, after, squares.size());
        squares.insertAfter(node, square);
        // GO stays the head, so the salary test in step() is unaffected, and
        // size() grows by one, which keeps the search budgets right.
        return new String[] {square.getName(), after};
    }

    // ------------------------------------------------------------ access

    public Node<Square> getGo() {
        return goNode;
    }

    public Node<Square> getJail() {
        return jailNode;
    }

    // The "remaining" budget for the first call of findByName and findNearest.
    public int size() {
        return squares.size();
    }

    /**
     * Mandatory recursive method (brief 5.1). Moves steps squares from current:
     * along next if steps is positive, along prev if negative. Pays p the
     * salary when a forward step lands on GO. Returns the destination node.
     *
     * Base case: steps is 0, return current.
     * Recursive case: move one node, then solve the same problem with steps
     * one closer to 0.
     * Stops because every call moves steps one closer to 0, from either side.
     *
     * It does not set p's position and does not log. Game's move helper does
     * both, so MOVE can be logged before SALARY (Appendix C.1).
     */
    public Node<Square> step(Node<Square> current, int steps, Player p) {
        if (steps == 0) {
            return current;
        }
        if (steps > 0) {
            Node<Square> next = current.next;
            // Tested on the node being stepped ONTO. A player who starts on GO
            // steps off it and is not paid; a player who passes or lands on GO
            // is paid exactly once.
            if (next == goNode) {
                p.addCash(SALARY);
            }
            return step(next, steps - 1, p);
        }
        // Backward: follow prev. No salary test here, so moving backward can
        // never pay (rule 3.3).
        return step(current.prev, steps + 1, p);
    }

    /**
     * Mandatory recursive method (brief 5.1). True if p owns every PROPERTY of
     * color, going once around the board. First call: current == start.
     *
     * Base cases: (a) current is a PROPERTY of that color not owned by p:
     * false. (b) current passed and current.next is start: the lap is done, true.
     * Recursive case: current passed, check from current.next.
     * Stops because each call moves one node forward on a finite ring, so
     * current.next reaches start after at most size calls.
     */
    public boolean ownsGroup(Node<Square> current, Node<Square> start, String color, Player p) {
        Square square = current.data;
        if (square.getType().equals("PROPERTY")) {
            // Safe cast: only PropertySquare answers "PROPERTY".
            PropertySquare property = (PropertySquare) square;
            if (property.getColor().equals(color) && property.getOwner() != p) {
                return false;
            }
        }
        // The lap test is on current.next, not on current. On the first call
        // current == start, so testing current would stop before checking
        // anything.
        if (current.next == start) {
            return true;
        }
        return ownsGroup(current.next, start, color, p);
    }

    /**
     * Mandatory recursive method (brief 5.1). Returns the node of the square
     * with this name, or null after remaining squares. Used by MOVE_TO cards.
     *
     * Base cases: remaining is 0, null. The name matches, return current.
     * Recursive case: look at current.next with remaining - 1.
     * Stops because remaining drops by 1 each call. Without it a name that is
     * not on the board would circle forever: a ring has no end.
     */
    public Node<Square> findByName(Node<Square> current, String name, int remaining) {
        if (remaining <= 0) {
            return null;
        }
        if (current.data.getName().equals(name)) {
            return current;
        }
        return findByName(current.next, name, remaining - 1);
    }

    /**
     * Mandatory recursive method (brief 5.1). Returns the NEXT square of the
     * given type moving forward from current, or null after remaining squares.
     * Used by NEAREST cards.
     *
     * The square the player stands on is not a candidate at the start: the
     * search looks at current.next first. With remaining = board size it
     * checks every square once and the starting square last, after a full lap.
     *
     * Base cases: remaining is 0, null. The next square matches, return it.
     * Recursive case: search on from the next node with remaining - 1.
     * Stops because remaining drops by 1 each call.
     */
    public Node<Square> findNearest(Node<Square> current, String type, int remaining) {
        if (remaining <= 0) {
            return null;
        }
        // Unlike findByName, the test is on the node AHEAD. "Nearest" means a
        // square the player moves forward to, never the one already under them.
        Node<Square> next = current.next;
        if (next.data.getType().equals(type)) {
            return next;
        }
        return findNearest(next, type, remaining - 1);
    }

    /**
     * Suggested helper, recursive. Counts the next links from one node to
     * another. findByName and findNearest only FIND a node; the player must
     * still walk there through step(), so the salary test runs. Game passes
     * this count to its move helper.
     *
     * Base case: same node, 0. Recursive case: 1 + the count from from.next.
     * Call it only with a node that was just found on this ring; that is what
     * guarantees it stops within one lap.
     */
    public int stepsForward(Node<Square> from, Node<Square> to) {
        if (from == to) {
            return 0;
        }
        return 1 + stepsForward(from.next, to);
    }

 * One line of the card file (brief Section 5): id, text, effect, argument.
 * File line: <deck>|<id>|<text>|<effect>|<argument>
 *
 * A card is data only and never changes after loading. Game applies the
 * effect, because effects need the board, the queues and the other players.
 */
public class Card {

    // "CHANCE" or "COMMUNITY". Added field: a JAIL_FREE card leaves its deck
    // while a player holds it and must later return to the back of its own
    // deck (rule 3.5), so the card has to remember where it came from.
    private String deck;

    // Printed in the CARD log line.
    private String id;

    // Shown to the players.
    private String text;

    // MOVE_TO, MOVE_BY, NEAREST, COLLECT, PAY, PAY_EACH, COLLECT_EACH,
    // GO_TO_JAIL or JAIL_FREE (Appendix B).
    private String effect;

    // A square name, a type, an integer as text, or empty. Kept as the String
    // read from the file because its meaning depends on the effect.
    private String argument;

    public Card(String deck, String id, String text, String effect, String argument) {
        this.deck = deck;
        this.id = id;
        this.text = text;
        this.effect = effect;
        this.argument = argument;
    }

    public String getDeck() {
        return deck;
    }

    public String getId() {
        return id;
    }

    public String getText() {
        return text;
    }

    public String getEffect() {
        return effect;
    }

    public String getArgument() {
        return argument;
    }

    // For MOVE_BY, COLLECT, PAY, PAY_EACH and COLLECT_EACH, whose argument is
    // a whole number ("-3", "200").
    public int getAmount() {
        return Integer.parseInt(argument.trim());
    }

import java.io.FileReader;
import java.io.IOException;
import java.util.ArrayList;
import java.util.Collections;
import java.util.Random;

/**
 * Suggested helper class (not in Section 5): turns the card file into a deck.
 *
 * Data flow for one deck (rules 3.1, 3.5 and Section 4):
 *     card file  ->  ArrayList<Card>  ->  shuffled once  ->  LinkedQueue<Card>
 *
 * Game calls loadDeck twice, once for "CHANCE" and once for "COMMUNITY", and
 * keeps the two queues. After that the ArrayList is gone: during play a deck
 * is only ever a queue (dequeue to draw, enqueue to return).
 *
 * The loops here are allowed. Loading runs once at setup and is not reached
 * from any of the mandatory recursive methods.
 */
public class CardLoader {

    /**
     * Reads the cards of one deck from the file, shuffles them once and
     * returns them as a queue, front card first to be drawn.
     *
     * random decides the shuffle. Passing new Random(seed) gives the same card
     * order every run, which makes a game repeatable.
     */
    public static LinkedQueue<Card> loadDeck(String fileName, String deck, Random random) throws IOException {
        // "The card list before shuffling" is one of the three ArrayList roles
        // in Section 4. A queue cannot be shuffled: it only reaches its front.
        ArrayList<Card> list = new ArrayList<Card>();

        BufferedReader in = new BufferedReader(new FileReader(fileName));
        String line = in.readLine();
        while (line != null) {
            line = line.trim();
            if (!line.isEmpty() && !line.startsWith("#")) {
                Card card;
                try {
                    card = makeCard(line);
                    checkNewId(list, card);
                } catch (IllegalArgumentException e) {
                    in.close();
                    throw e;
                }
                // Both decks share one file; keep only the lines of this deck.
                if (card.getDeck().equals(deck)) {
                    list.add(card);
                }
            }
            line = in.readLine();
        }
        in.close();

        // Shuffled once, here, and never again (rule 3.1). Collections on an
        // ArrayList is allowed by rule 4.2.
        Collections.shuffle(list, random);

        // Move the shuffled order into our own queue. Index 0 is enqueued
        // first, so it becomes the front: the first card drawn.
        LinkedQueue<Card> queue = new LinkedQueue<Card>();
        for (int i = 0; i < list.size(); i++) {
            queue.enqueue(list.get(i));
        }
        return queue;
    }

    // One file line: <deck>|<id>|<text>|<effect>|<argument>
    private static Card makeCard(String line) {
        // The -1 keeps a trailing empty field, so "K4|...|GO_TO_JAIL|" still
        // has an (empty) argument instead of losing it.
        String[] f = line.split("\\\\|", -1);
        if (f.length < 4) {
            throw new IllegalArgumentException("Card line needs deck|id|text|effect|argument: " + line);
        }
        String deck = f[0].trim();
        String id = f[1].trim();
        String text = f[2].trim();
        String effect = f[3].trim();
        String argument = "";
        if (f.length > 4) {
            argument = f[4].trim();
        }

        // A card with a wrong deck name would be dropped silently, and one
        // with a misspelt effect would be drawn and do nothing. Failing here,
        // at setup, is easier to find than either.
        if (!deck.equals("CHANCE") && !deck.equals("COMMUNITY")) {
            throw new IllegalArgumentException("Card " + id + " has an unknown deck: " + deck);
        }

        Card card = new Card(deck, id, text, effect, argument);

        if (effect.equals("MOVE_BY") || effect.equals("COLLECT") || effect.equals("PAY")
                || effect.equals("PAY_EACH") || effect.equals("COLLECT_EACH")) {
            // These five need a whole number. Read it once now so a bad file
            // fails at setup and not in the middle of a game.
            try {
                card.getAmount();
            } catch (NumberFormatException e) {
                throw new IllegalArgumentException("Card " + id + " needs a number, found: " + argument);
            }
        } else if (effect.equals("MOVE_TO") || effect.equals("NEAREST")) {
            if (argument.isEmpty()) {
                throw new IllegalArgumentException("Card " + id + " needs a square name or type.");
            }
        } else if (!effect.equals("GO_TO_JAIL") && !effect.equals("JAIL_FREE")
                && !effect.equals("REVERSE") && !effect.equals("RECALL")) {
            // The nine core effects of Appendix B, plus REVERSE (twist T1)
            // and RECALL (twist T7).
            // Other twist effects are added here when they are implemented.
            throw new IllegalArgumentException("Card " + id + " has an unknown effect: " + effect);
        }
        return card;
    }

    // The CARD log line prints only the id, so two cards sharing an id could
    // not be told apart in a trace.
    private static void checkNewId(ArrayList<Card> list, Card card) {
        for (int i = 0; i < list.size(); i++) {
            if (list.get(i).getId().equals(card.getId())) {
                throw new IllegalArgumentException("Card file has two cards with id " + card.getId() + ".");
            }
        }
    }

 * A CHANCE or COMMUNITY square: deck (brief Section 5).
 * Rule 3.2: draw the top card of that deck and apply it.
 */
public class CardSquare extends Square {

    // "CHANCE" or "COMMUNITY". It names which of Game's two queues to draw
    // from. The square does not hold the queue itself: the decks belong to Game.
    private String deck;

    public CardSquare(String name, String deck) {
        super(name);
        this.deck = deck;
    }

    @Override
    public void land(Game game, Player player) {
        // Card effects need the board, both queues and the other players, so
        // Game applies them. If the card moves the player, Game.landOn (not
        // this method) resolves the new square.
        game.drawCard(player, deck);
    }

    @Override
    public String getType() {
        // The board file uses the deck name as the type word.
        return deck;
    }

    public String getDeck() {
        return deck;
    }

 * The board ring (brief Section 3): addLast, insertAfter, remove, getHead, size.
 *
 * Ring rule every method keeps, for every node n in the list:
 *     n.next.prev == n   and   n.prev.next == n
 * There is no null link inside the ring and no tail field: the tail is head.prev.
 *
 * No method here contains a loop. That matters because the recursive methods of
 * Section 5 call into this class, and anything they call must be recursive or
 * constant time.
 */
public class CircularDoublyLinkedList<T> {

    // The entry point to the ring. Board reads it once to find GO; every other
    // node is reached from here by following next. Null only when the list is empty.
    private Node<T> head;

    // Kept as a counter so size() is O(1). findByName and findNearest use it as
    // their "remaining" budget; counting nodes instead would need a loop.
    private int size;

    public CircularDoublyLinkedList() {
        head = null;
        size = 0;
    }

    /** Adds a new node at the end of the ring, just before head. O(1). */
    public void addLast(T data) {
        Node<T> node = new Node<T>(data);

        if (head == null) {
            // First node: it is its own neighbour in both directions. This is
            // what makes a one-square board still a ring, so step() never
            // meets a null link.
            node.next = node;
            node.prev = node;
            head = node;
        } else {
            // Read the old tail before changing anything; after the writes
            // below head.prev no longer points to it.
            Node<T> tail = head.prev;

            // New node first: these two writes cannot break the ring, because
            // nothing in the ring points to the new node yet.
            node.prev = tail;
            node.next = head;

            // Then the two neighbours. After these the ring rule holds again
            // and the new node is the tail. head does not change, so GO stays GO.
            tail.next = node;
            head.prev = node;
        }
        size++;
    }

    /** Adds a new node between node and node.next. O(1). */
    public void insertAfter(Node<T> node, T data) {
        Node<T> added = new Node<T>(data);

        // Save the old successor first. Once node.next is overwritten there is
        // no other way back to it without walking the ring.
        Node<T> after = node.next;

        // New node's own links first (safe, nothing points to it yet).
        added.prev = node;
        added.next = after;

        // Then splice it in. If node is the tail, after is head, so this also
        // covers "insert at the end" with no special case.
        node.next = added;
        after.prev = added;

        size++;
    }

    /** Unlinks node so its two neighbours point to each other. O(1). */
    public void remove(Node<T> node) {
        if (size == 1) {
            // Removing the only node empties the ring. Without this case head
            // would keep pointing at a node that is no longer in the list.
            head = null;
        } else {
            // The two writes that take node out of the ring. prev is why this
            // is O(1): with only next we would have to walk to find the node
            // before this one.
            node.prev.next = node.next;
            node.next.prev = node.prev;

            // If head itself is removed, the ring still needs an entry point.
            if (node == head) {
                head = node.next;
            }
        }

        // Cut the removed node's own links, so a node is either fully in the
        // ring or fully out of it, never half connected.
        node.next = null;
        node.prev = null;

        size--;
    }

    /** The first node (GO on the board), or null when the list is empty. O(1). */
    public Node<T> getHead() {
        return head;
    }

    /** Number of nodes. O(1), returns the counter and never walks the ring. */
    public int size() {
        return size;
    }

 * GO, JAIL, FREE or GO_TO_JAIL (brief Section 5).
 * Rule 3.2: only GO_TO_JAIL does anything when a player lands on it.
 */
public class CornerSquare extends Square {

    // One of "GO", "JAIL", "FREE", "GO_TO_JAIL": the type word of the board file.
    private String kind;

    public CornerSquare(String name, String kind) {
        super(name);
        this.kind = kind;
    }

    @Override
    public void land(Game game, Player player) {
        if (kind.equals("GO_TO_JAIL")) {
            // Game moves the player straight to the JAIL node: no step(), so
            // no salary (rule 3.6).
            game.sendToJail(player);
        }
        // GO: nothing here. The salary is paid by Board.step while moving, so
        // a player who passes GO without landing on it is paid too.
        // JAIL (just visiting) and FREE: nothing.
    }

    @Override
    public String getType() {
        return kind;
    }

/**
 * Rolls two six-sided dice (brief Section 5).
 *
 * The log needs both values separately (ROLL and JAIL_ROLL lines), so the
 * class remembers the last roll and reports each die, the total, and whether
 * the roll was a double. Every method is constant time, so the recursive
 * Game.takeTurn may call them.
 */
public class Dice {

    // java.util.Random is one of the four allowed java.util classes (rule 4.2).
    private Random random;

    // The two values of the last roll. Kept apart: a double is "first equals
    // second", which the total alone cannot tell (4 could be 2+2 or 1+3).
    private int first;
    private int second;

    // Normal play: a different game every run.
    public Dice() {
        random = new Random();
    }

    // Fixed seed: the same dice every run. The brief says the same dice and
    // card order must give the same game, so a seed makes a run repeatable
    // for tracing and for the demo.
    public Dice(long seed) {
        random = new Random(seed);
    }

    // Rolls both dice. Call once per roll, then read the values below; the
    // getters never roll again, so ROLL logs exactly what the move used.
    public void roll() {
        // nextInt(6) gives 0 to 5, so + 1 gives 1 to 6.
        first = random.nextInt(6) + 1;
        second = random.nextInt(6) + 1;
    }

    public int getFirst() {
        return first;
    }

    public int getSecond() {
        return second;
    }

    // The number of squares to move.
    public int getTotal() {
        return first + second;
    }

    // Decides the extra roll in takeTurn and the release from Jail.
    public boolean isDouble() {
        return first == second;
    }
}`},{name:"Game",file:"Game.java",lines:768,role:"The rules. Turns, moves, money, Jail, cards, bankruptcy, twists T1 and T7, the game loop and the ranking.",group:"rules",extends:null,abstract:!1,fields:[{name:"board",type:"Board",vis:"private",static:!1,doc:"",value:""},{name:"turnQueue",type:"LinkedQueue<Player>",vis:"private",static:!1,doc:`Turn order. The player whose turn it is has been dequeued and is NOT in

import java.util.Scanner;

/**
 * Runs the rules of Section 3 (brief Section 5): board, turnQueue, chance,
 * community, game loop.
 *
 * Two of the mandatory recursive methods are here: takeTurn and landOn.
 *
 * Everything reached from takeTurn or landOn (the move helper, the Jail
 * helper, the card helper, payments, bankruptcy) contains no loop: each is
 * constant time or recursive (brief 5.1). The only loops in this class are in
 * play() and printRanking(), which run outside those two methods.
 */
public class Game {

    private Board board;

    // Turn order. The player whose turn it is has been dequeued and is NOT in
    // this queue until their turn ends.
    private LinkedQueue<Player> turnQueue;

    // The two decks. Draw = dequeue, return = enqueue.
    private LinkedQueue<Card> chance;
    private LinkedQueue<Card> community;

    // Every player in join order, bankrupt or not. This is the "list of all
    // players for the final ranking" role of ArrayList in Section 4.
    private ArrayList<Player> players;

    // Players in the order they went bankrupt, oldest first. The ranking
    // needs this order; our own queue records it without another collection.
    private LinkedQueue<Player> bankruptOrder;

    private Dice dice;
    private GameLogger logger;

    // Where the buy answer is read from (the keyboard in a real game).
    private Scanner input;

    // Turns started so far. Printed in TURN and tested against maxTurns.
    private int turnCount;

    private int maxTurns = 60; // rule 3.7 default

    public static final int EXPANSION_TURN = 20; // twist T3

    // The note the card helper leaves for landOn: "this card moved the player
    // to another square". landOn reads it, clears it, and calls itself.
    private boolean cardMoved;

    // Safety limit for landOn: how many card moves may follow one another
    // from a single landing. Normal chains are 1 or 2 long.
    public static final int MAX_CARD_CHAIN = 10;

    // How many landOn calls are currently open on top of the first one.
    // landOn adds 1 before it calls itself and takes 1 off when that call
    // returns, so the count is back to 0 after every landing.
    private int chainDepth;

    public Game(Board board, LinkedQueue<Card> chance, LinkedQueue<Card> community,
                Dice dice, GameLogger logger, Scanner input) {
        this.board = board;
        this.chance = chance;
        this.community = community;
        this.dice = dice;
        this.logger = logger;
        this.input = input;
        this.turnQueue = new LinkedQueue<Player>();
        this.players = new ArrayList<Player>();
        this.bankruptOrder = new LinkedQueue<Player>();
        this.turnCount = 0;
        this.cardMoved = false;
        this.chainDepth = 0;
    }

    public void setMaxTurns(int maxTurns) {
        this.maxTurns = maxTurns;
    }

    // ------------------------------------------------------------ setup

    /**
     * Adds a player: 1,500 in cash, standing on GO, at the back of the turn
     * queue. Turn order is therefore the order of these calls (rule 3.1).
     */
    public Player addPlayer(String name) {
        if (players.size() == 6) {
            throw new IllegalStateException("A game has at most 6 players.");
        }
        Player player = new Player(name, board.getGo());
        players.add(player);       // join order, for ranking ties
        turnQueue.enqueue(player); // turn order
        return player;
    }

    public Board getBoard() {
        return board;
    }

    public LinkedQueue<Player> getTurnQueue() {
        return turnQueue;
    }

    // Maps the deck word used by CardSquare and Card to the queue itself.
    // The one place that does it, so a JAIL_FREE card always finds its home.
    public LinkedQueue<Card> getDeck(String deck) {
        if (deck.equals("CHANCE")) {
            return chance;
        }
        return community;
    }

    // ------------------------------------------------------------ buying

    /**
     * Asks the player whether to buy (rule 3.4: "the player decides").
     * Called by PropertySquare.land and TransitSquare.land, which have
     * already checked that the player can afford it.
     *
     * Reads ONE answer. Anything that is not yes means no. A "keep asking
     * until the answer is valid" loop is not allowed here: this is reached
     * from landOn.
     */
    public boolean wantsToBuy(Player player, Square square) {
        System.out.println(player.getName() + ", buy " + square.getName() + " for "
                + square.getPrice() + "? You have " + player.getCash() + ". (yes/no)");
        if (!input.hasNextLine()) {
            return false; // no answer available: treated as no
        }
        String answer = input.nextLine().trim();
        return answer.equalsIgnoreCase("yes") || answer.equalsIgnoreCase("y");
    }

    /**
     * BUY|<player>|<square>|<cash>. Called by the square after it has taken
     * the price and set the owner, so the cash printed is the balance after.
     */
    public void logBuy(Player player, Square square) {
        logger.buy(player, square);
    }

    // ------------------------------------------------------------ payments

    /**
     * Rent from payer to owner. Called by PropertySquare.land and
     * TransitSquare.land with the rent already worked out.
     * Log: RENT with the amount actually paid, then BANKRUPT if it was short.
     */
    public void payRent(Player payer, Player owner, int amount) {
        int paid = transfer(payer, owner, amount);
        logger.rent(payer, owner, paid);
        if (paid < amount) {
            goBankrupt(payer, owner);
        }
    }

    /**
     * A fixed amount to the bank. Called by TaxSquare.land.
     * Log: TAX with the amount actually paid, then BANKRUPT if it was short.
     */
    public void payTax(Player player, int amount) {
        int paid = transfer(player, null, amount);
        logger.tax(player, paid);
        if (paid < amount) {
            goBankrupt(player, null);
        }
    }

    /**
     * The payment helper: the ONE place where money leaves a player.
     * creditor is a player, or null for the bank.
     *
     * Returns the amount actually paid. If it is less than the amount due,
     * the payer could not pay in full and the caller must call goBankrupt.
     * It returns instead of doing that itself so the caller can print its
     * payment line (RENT, TAX, CASH) BEFORE the BANKRUPT line (Appendix C.1).
     *
     * Constant time.
     */
    private int transfer(Player payer, Player creditor, int amount) {
        int paid = amount;
        if (payer.getCash() < amount) {
            // Rule 3.7: the creditor gets all the remaining cash. Capping here
            // is what keeps a balance from ever going below 0.
            paid = payer.getCash();
        }
        payer.addCash(-paid);
        if (creditor != null) {
            // Exactly what left the payer arrives at the creditor: money is
            // never created or lost between two players. Paid to the bank, it
            // simply leaves the game.
            creditor.addCash(paid);
        }
        return paid;
    }

    // ------------------------------------------------------------ bankruptcy

    /**
     * Rule 3.7. Called right after a payment that fell short; the payer's
     * cash is already 0 and the creditor already has it.
     *
     * It does NOT touch the turn queue. The current player is not in the
     * queue; whoever holds the player reads isBankrupt() and does not enqueue
     * them again.
     */
    private void goBankrupt(Player player, Player creditor) {
        // 1. Squares go back to the bank. Both sides of the ownership link are
        //    cleared: each square's owner, then the player's list.
        releaseSquares(player.getOwned(), 0);
        player.resetOwned();

        // 2. JAIL_FREE cards go to the back of their own decks.
        returnJailFreeCards(player);

        // 3. Mark and record. The mark is what every other method tests.
        player.markBankrupt();
        bankruptOrder.enqueue(player);

        // 4. After the payment line, which the caller has already printed.
        logger.bankrupt(player, creditor);
    }

    // Recursive, no loop: sets owner = null on every square from index to the
    // end of the list. Base case: index is the list size. Stops because index
    // rises by 1 and the list is not changed during the walk.
    private void releaseSquares(ArrayList<Square> owned, int index) {
        if (index >= owned.size()) {
            return;
        }
        Square square = owned.get(index);
        // Only these two types can be owned, and only they have an owner
        // field. The type word makes each cast safe.
        if (square.getType().equals("PROPERTY")) {
            ((PropertySquare) square).setOwner(null);
        } else if (square.getType().equals("TRANSIT")) {
            ((TransitSquare) square).setOwner(null);
        }
        releaseSquares(owned, index + 1);
    }

    // Recursive, no loop: hands back one card per call. Base case: the player
    // holds none. Stops because each call removes one card from the player.
    private void returnJailFreeCards(Player player) {
        if (!player.hasJailFreeCard()) {
            return;
        }
        Card card = player.useJailFreeCard();
        getDeck(card.getDeck()).enqueue(card); // back of the deck it came from
        returnJailFreeCards(player);
    }

    // ------------------------------------------------------------ Jail

    /**
     * The send-to-Jail helper (rule 3.6). Called by CornerSquare.land for
     * GO_TO_JAIL, by takeTurn (third double) and by the card helper.
     *
     * One of only two places that write a position. It assigns the JAIL node
     * directly: no step(), so GO is not passed and no salary is paid.
     */
    public void sendToJail(Player player) {
        player.setPosition(board.getJail());
        player.enterJail();
        logger.jail(player);
    }

    /**
     * The Jail helper (rule 3.6): what happens when a jailed player's turn
     * starts. Called by playTurn. No loop: one decision per turn.
     */
    private void jailTurn(Player p) {
        // 1. A JAIL_FREE card is used first: it returns to the back of its
        //    own deck, and the player takes a normal turn.
        if (p.hasJailFreeCard()) {
            Card card = p.useJailFreeCard();
            getDeck(card.getDeck()).enqueue(card);
            logger.jailFree(p);
            p.leaveJail();
            takeTurn(p, 0);
            return;
        }

        // 2. Otherwise one roll. It is logged as JAIL_ROLL, not ROLL.
        dice.roll();
        int d1 = dice.getFirst();
        int d2 = dice.getSecond();
        int total = dice.getTotal();

        if (dice.isDouble()) {
            // Released: move by this roll and resolve the square. takeTurn is
            // NOT called, so this double earns no extra roll.
            logger.jailRoll(p, d1, d2, "RELEASED");
            p.leaveJail();
            moveBy(p, total);
            landOn(p);
            return;
        }

        if (p.getJailAttempts() < 2) {
            // First or second failure: stay.
            logger.jailRoll(p, d1, d2, "STAY");
            p.addJailAttempt();
            return;
        }

        // 3. Third failure: pay 50, then move by this same roll.
        // Log order (Appendix C.1): JAIL_ROLL with FINE, CASH -50, then MOVE.
        logger.jailRoll(p, d1, d2, "FINE");
        payBank(p, 50);
        if (p.isBankrupt()) {
            return; // could not pay the fine: out of the game, no move
        }
        p.leaveJail(); // also resets the attempts to 0
        moveBy(p, total);
        landOn(p);
    }

    // ------------------------------------------------------------ movement

    /**
     * The move helper: the single doorway for every move in the game (dice,
     * Jail release, MOVE_BY, MOVE_TO, NEAREST). Together with sendToJail it
     * is the only place that writes a position.
     *
     * Constant time apart from Board.step, which is recursive.
     * It does not call landOn: the caller decides what happens next.
     */
    private void moveBy(Player p, int steps) {
        Node<Square> from = p.getPosition();
        int cashBefore = p.getCash();

        // step() walks the links and pays the salary, but does not log.
        Node<Square> to = board.step(from, steps, p);
        p.setPosition(to);

        // Appendix C.1: MOVE first, then SALARY. step() changes cash for one
        // reason only, so a higher balance means GO was passed.
        logger.move(p, from.data, to.data);
        logSalaries(p, cashBefore + Board.SALARY);
    }

    // Recursive, no loop: one SALARY line per salary step() paid, each with
    // the balance after that salary. A dice roll can pass GO only once; a
    // MOVE_BY card of more than a lap passes it again and is paid again.
    // Base case: balance is more than the player has, so nothing (more) was
    // paid. Stops because balance rises by 200 each call.
    private void logSalaries(Player p, int balance) {
        if (balance > p.getCash()) {
            return;
        }
        logger.salary(p, balance);
        logSalaries(p, balance + Board.SALARY);
    }

    // ------------------------------------------------------------ the turn

    /**
     * Mandatory recursive method (brief 5.1): plays one roll, then calls
     * itself after a double. The third double sends the player to Jail.
     * doublesCount = doubles already rolled this turn; the first call passes 0.
     *
     * Base cases (return without recursing): the roll was not a double; it
     * was the third double; the player is now in Jail; the player is now
     * bankrupt.
     * Recursive case: a double, and the player is still free and solvent.
     * Stops because doublesCount rises by 1 per call and a call with 2 can
     * never recurse (a double there goes to Jail): at most three calls.
     */
    public void takeTurn(Player p, int doublesCount) {
        dice.roll();
        logger.roll(p, dice.getFirst(), dice.getSecond());

        // Remembered now, so the test after landOn does not depend on the
        // dice still showing this roll.
        boolean wasDouble = dice.isDouble();

        if (wasDouble && doublesCount == 2) {
            // Third double: no move. ROLL is followed directly by JAIL.
            sendToJail(p);
            return;
        }

        moveBy(p, dice.getTotal());
        landOn(p);

        // Rule 3.3 step 7: being sent to Jail ends the turn even after a
        // double. A bankrupt player also rolls no more.
        if (wasDouble && !p.isInJail() && !p.isBankrupt()) {
            takeTurn(p, doublesCount + 1);
        }
    }

    /**
     * Mandatory recursive method (brief 5.1): resolves the square the player
     * is standing on. Calls itself when a card moved the player to another
     * square.
     *
     * Base case: the square did not move the player, or the player is now in
     * Jail or bankrupt.
     * Recursive case: a card moved the player and they are still free and
     * solvent: resolve the new square.
     * Stops when a chain reaches a square that does not move the player, and
     * in any case after MAX_CARD_CHAIN card moves. Without that limit a pair
     * of cards could send a player back and forth between two card squares
     * forever, because cards return to their decks and a deck never runs out.
     */
    public void landOn(Player p) {
        // Game does not test the square's type: the subclass applies its rule.
        p.getPosition().data.land(this, p);

        // Read the card helper's note and clear it BEFORE recursing, so the
        // next square starts with a clean note.
        boolean moved = cardMoved;
        cardMoved = false;

        // chainDepth < MAX_CARD_CHAIN is the safety limit. When it is reached
        // the chain ends here: the player stays where the last card put them
        // and that square is not resolved.
        if (moved && !p.isInJail() && !p.isBankrupt() && chainDepth < MAX_CARD_CHAIN) {
            chainDepth++;
            landOn(p);
            chainDepth--;
        }
    }

    /**
     * One full turn (rule 3.3): dequeue, play, enqueue.
     * This is the only place that rotates the turn queue for a normal turn.
     */
    public void playTurn() {
        // The current player is OUT of the queue for the whole turn.
        Player p = turnQueue.dequeue();
        turnCount++;
        logger.turn(turnCount, p);

        if (p.isInJail()) {
            jailTurn(p);     // the Jail rules decide whether and how they move
        } else {
            takeTurn(p, 0);
        }

        // A bankrupt player is simply not enqueued again: that is how the
        // current player leaves the game.
        if (!p.isBankrupt()) {
            turnQueue.enqueue(p);
        }

        // Twist T3: the EXPAND lines are applied at the end of turn 20, after
        // everything that turn did and before the next TURN line.
        if (turnCount == EXPANSION_TURN) {
            applyExpansions();
        }
    }

    // Twist T3. Recursive, no loop: applies one waiting EXPAND line per call,
    // in file order, and logs it. Base case: none left. Stops because each
    // call removes one line from the board's queue.
    private void applyExpansions() {
        if (!board.hasExpansion()) {
            return;
        }
        String[] done = board.applyNextExpansion(); // {new square, after square}
        logger.expand(done[0], done[1]);
        applyExpansions();
    }

    // ------------------------------------------------------------ cards

    /**
     * The card helper (rule 3.5). Called by CardSquare.land.
     * Draw = dequeue, log CARD, apply, enqueue at the back.
     *
     * It never calls landOn and never assigns a position. For a moving card
     * it goes through moveBy and leaves the cardMoved note; landOn then
     * resolves the new square. The card is already back in its deck by then,
     * so a second draw from the same deck finds it complete.
     */
    public void drawCard(Player p, String deckName) {
        LinkedQueue<Card> deck = getDeck(deckName);
        if (deck.isEmpty()) {
            return; // every card of this deck is being held by players
        }
        Card card = deck.dequeue();
        logger.card(p, card); // CARD first, then the lines of its effect

        String effect = card.getEffect();
        if (effect.equals("JAIL_FREE")) {
            // The exception: the card stays with the player, out of the deck.
            p.addJailFreeCard(card);
            return;
        }

        if (effect.equals("MOVE_BY")) {
            // A card that moves 0 squares does not move the player, so it
            // must not ask landOn to resolve "the new square": that would
            // draw from the same deck again, and again.
            if (card.getAmount() != 0) {
                moveBy(p, card.getAmount());
                cardMoved = true;
            }
        } else if (effect.equals("MOVE_TO")) {
            walkTo(p, board.findByName(p.getPosition(), card.getArgument(), board.size()));
        } else if (effect.equals("NEAREST")) {
            walkTo(p, board.findNearest(p.getPosition(), card.getArgument(), board.size()));
        } else if (effect.equals("COLLECT")) {
            p.addCash(card.getAmount());
            logger.cash(p, card.getAmount());
        } else if (effect.equals("PAY")) {
            payBank(p, card.getAmount());
        } else if (effect.equals("PAY_EACH")) {
            payEach(p, card.getAmount(), turnQueue.size());
        } else if (effect.equals("COLLECT_EACH")) {
            collectEach(p, card.getAmount(), turnQueue.size());
        } else if (effect.equals("GO_TO_JAIL")) {
            sendToJail(p); // changes the square but does NOT set cardMoved
        } else if (effect.equals("REVERSE")) {
            // Twist T1. The current player is not in the queue right now, so
            // only the waiting players are reversed; playTurn enqueues the
            // current player at the back afterwards, as on any turn.
            reverse(turnQueue);
            logger.reverse(p);
            logger.order(queueNames(turnQueue.size()));
        } else if (effect.equals("RECALL")) {
            // Twist T7. The RECALL card itself is out of the deck right now,
            // so deck.size() is the number of cards "apart from the RECALL
            // card". With 3 or fewer, nothing changes and nothing is logged.
            int others = deck.size();
            if (others > 3) {
                // Sending the first (others - 3) cards to the back leaves the
                // last three at the front, still in their own order.
                rotate(deck, others - 3);
                logger.recall(deckName, frontIds(deck, others, 3));
            }
        }

        deck.enqueue(card);
    }

    /**
     * Twist T1 (Appendix A), required signature. Reverses a queue in place.
     * Recursive, no loop, and it uses ONLY enqueue, dequeue and isEmpty: no
     * other list, array or stack. The call stack does the remembering.
     *
     * Base case: the queue is empty, nothing to do.
     * Recursive case: take the front element out, reverse what is left, then
     * put the element back in, which places it at the back.
     * Stops because each call removes one element before recursing, so the
     * queue reaches empty after as many calls as it had elements.
     *
     * Example with B C D: B is held, then C, then D. The queue is empty, so
     * the calls return in the opposite order: D is enqueued, then C, then B.
     */
    public static <T> void reverse(LinkedQueue<T> q) {
        if (q.isEmpty()) {
            return;
        }
        T front = q.dequeue();
        reverse(q);
        q.enqueue(front);
    }

    /**
     * Twist T7 (Appendix A), required signature. Moves k elements from the
     * front of a queue to the back, one per call. Recursive, no loop, queue
     * operations only.
     *
     * Base case: k is 0 (or less), or the queue is empty: nothing to move.
     * Recursive case: move the front element to the back, then move k - 1 more.
     * Stops because k drops by 1 each call.
     */
    public static <T> void rotate(LinkedQueue<T> q, int k) {
        if (k <= 0 || q.isEmpty()) {
            return;
        }
        q.enqueue(q.dequeue());
        rotate(q, k - 1);
    }

    // The fields of the RECALL line: "|id" for the first \`take\` cards of a
    // deck, front first. Recursive rotation, no loop: every card passes from
    // front to back once (remaining = deck size), so the order is unchanged;
    // only the first \`take\` of them add their id.
    private String frontIds(LinkedQueue<Card> deck, int remaining, int take) {
        if (remaining == 0) {
            return "";
        }
        Card card = deck.dequeue();
        deck.enqueue(card);
        String id = "";
        if (take > 0) {
            id = "|" + card.getId();
        }
        return id + frontIds(deck, remaining - 1, take - 1);
    }

    // The fields of the ORDER line: "|name" for each waiting player, front
    // first. Recursive rotation, no loop: each call moves the front player to
    // the back and adds their name, so after remaining = queue size calls the
    // queue is in the same order as before.
    private String queueNames(int remaining) {
        if (remaining == 0) {
            return "";
        }
        Player next = turnQueue.dequeue();
        turnQueue.enqueue(next);
        return "|" + next.getName() + queueNames(remaining - 1);
    }

    // MOVE_TO and NEAREST: the search only FOUND a node. The player still
    // walks there through moveBy, so the links are followed and the salary
    // test runs, exactly as for a dice roll.
    private void walkTo(Player p, Node<Square> target) {
        if (target == null) {
            return; // the card names something that is not on the board
        }
        int steps = board.stepsForward(p.getPosition(), target);
        if (steps > 0) {
            moveBy(p, steps);
            cardMoved = true;
        }
    }

    // Money to the bank with a CASH line: a PAY card or the Jail fine.
    private void payBank(Player p, int amount) {
        int paid = transfer(p, null, amount);
        logger.cash(p, -paid);
        if (paid < amount) {
            goBankrupt(p, null);
        }
    }

    // One player pays another with two CASH lines, payer first (Appendix C.1).
    private void payPlayer(Player payer, Player receiver, int amount) {
        int paid = transfer(payer, receiver, amount);
        logger.cash(payer, -paid);
        logger.cash(receiver, paid);
        if (paid < amount) {
            goBankrupt(payer, receiver);
        }
    }

    /**
     * PAY_EACH: the current player pays every other active player, in
     * turn-queue order. Recursive queue rotation, no loop, queue operations
     * only: dequeue the front player, pay them, enqueue them at the back.
     * After remaining = queue size calls, everyone is back in the same order.
     *
     * If the payer goes bankrupt part-way, the rotation still finishes (with
     * no more payments), otherwise the queue order would be left changed.
     */
    private void payEach(Player payer, int amount, int remaining) {
        if (remaining == 0) {
            return;
        }
        Player other = turnQueue.dequeue();
        if (!payer.isBankrupt()) {
            payPlayer(payer, other, amount);
        }
        turnQueue.enqueue(other);
        payEach(payer, amount, remaining - 1);
    }

    /**
     * COLLECT_EACH: every other active player pays the current player, in
     * turn-queue order. Same rotation as payEach.
     *
     * This is where a WAITING player can go bankrupt. They are "removed from
     * the queue without changing the order of the others" (rule 3.7) simply
     * by not being enqueued again; everyone else passes through in order.
     */
    private void collectEach(Player collector, int amount, int remaining) {
        if (remaining == 0) {
            return;
        }
        Player other = turnQueue.dequeue();
        payPlayer(other, collector, amount);
        if (!other.isBankrupt()) {
            turnQueue.enqueue(other);
        }
        collectEach(collector, amount, remaining - 1);
    }

    // ------------------------------------------------------------ game loop and ranking

    /**
     * The game loop: turns until an end rule holds, then END and the ranking.
     * The loop is allowed here: play() is not one of the mandatory recursive
     * methods and is not called by any of them.
     */
    public void play() {
        if (players.size() < 2) {
            throw new IllegalStateException("A game needs 2 to 6 players.");
        }
        String reason = endReason();
        while (reason == null) {
            playTurn();
            reason = endReason(); // checked after each turn (rule 3.7)
        }
        logger.end(reason);
        printRanking();
    }

    // null while the game goes on. LAST_PLAYER is tested first, so it is the
    // reason given when both rules hold after the same turn.
    private String endReason() {
        if (turnQueue.size() <= 1) {
            return "LAST_PLAYER";
        }
        if (turnCount >= maxTurns) {
            return "MAX_TURNS";
        }
        return null;
    }

    // Cash plus the purchase price of every owned square (rule 3.7).
    private int worth(Player p) {
        return p.getCash() + p.netWorth(p.getOwned(), 0);
    }

    /**
     * Final ranking: active players by net worth, highest first, ties by join
     * order; then bankrupt players, most recent first, each with 0.
     * Runs once after the game, so its loops are allowed.
     */
    private void printRanking() {
        // Active players, still in join order.
        ArrayList<Player> left = new ArrayList<Player>();
        for (int i = 0; i < players.size(); i++) {
            if (!players.get(i).isBankrupt()) {
                left.add(players.get(i));
            }
        }

        // Repeatedly take the richest player left. The comparison is a strict
        // ">", so among equals the one who joined first is taken first.
        int position = 1;
        while (!left.isEmpty()) {
            int best = 0;
            for (int i = 1; i < left.size(); i++) {
                if (worth(left.get(i)) > worth(left.get(best))) {
                    best = i;
                }
            }
            Player p = left.remove(best);
            logger.rank(position, p, worth(p));
            position++;
        }

        rankBankrupt(position);
    }

    // Recursive: prints the bankrupt players most recent first. The queue
    // holds them oldest first, so each call dequeues one player, lets the
    // later ones be printed first, and prints its own on the way back.
    // Returns the next free position.
    private int rankBankrupt(int position) {
        if (bankruptOrder.isEmpty()) {
            return position;
        }
        Player p = bankruptOrder.dequeue();
        int mine = rankBankrupt(position);
        logger.rank(mine, p, 0);
        return mine + 1;
    }

/**
 * Writes the standard game log (brief Section 5, Appendix C).
 *
 * This is the only class that knows the log format. One method per line type:
 * fields joined by | with no spaces, amounts as integers.
 *
 * Every cash value printed is "the balance after the change". The methods
 * read the balance from the Player when they are called, so the caller must
 * change the cash FIRST and log SECOND.
 *
 * The ORDER of lines (Appendix C.1) is not decided here: it is the order in
 * which Game calls these methods. Every method is constant time, so the
 * recursive methods may call them.
 */
public class GameLogger {

    // Where the lines go. Normally the screen; a check can pass another
    // stream to read the lines back.
    private PrintStream out;

    public GameLogger() {
        this.out = System.out;
    }

    public GameLogger(PrintStream out) {
        this.out = out;
    }

    // TURN|<n>|<player>            start of a turn, n from 1
    public void turn(int n, Player p) {
        out.println("TURN|" + n + "|" + p.getName());
    }

    // ROLL|<player>|<d1>|<d2>      each roll outside Jail

Used for the turn order (players) and for each card deck.

 * First-in, first-out queue on singly linked nodes (brief Section 3):
 * enqueue, dequeue, peek, isEmpty, size.
 *
 * Used for the turn order (players) and for each card deck.
 *
 * Queue rule every method keeps:
 *   - empty:      front == null, rear == null, size == 0
 *   - not empty:  following next from front reaches rear after size - 1 links,
 *                 and rear.next == null
 *
 * No method contains a loop, so the recursive methods of Section 5 may call
 * any of them.
 */
public class LinkedQueue<T> {

    // The queue's own node type. It has one link only (next), which is what
    // "singly linked" means. It is private so nothing outside this class can
    // hold or relink a queue node, and it is deliberately NOT the board's
    // Node<T>: that one carries a prev link the queue would never maintain.
    private static class QNode<T> {
        T data;          // the player or card waiting in line
        QNode<T> next;   // the element behind this one; null at the rear

        QNode(T data) {
            this.data = data;
            this.next = null;
        }
    }

    // Where elements leave. dequeue and peek read it, so both are O(1).
    private QNode<T> front;

    // Where elements join. Without this reference enqueue would have to walk
    // from front to the end, which needs a loop.
    private QNode<T> rear;

    // Kept as a counter so size() is O(1) and never walks the chain.
    private int size;

    public LinkedQueue() {
        front = null;
        rear = null;
        size = 0;
    }

    /** Adds data at the rear. O(1). */
    public void enqueue(T data) {
        QNode<T> node = new QNode<T>(data);

        if (rear == null) {
            // Empty queue: the one node is both first and last. Forgetting to
            // set front here would make the element unreachable by dequeue.
            front = node;
        } else {
            // Link the old last node to the new one. This is the only write
            // that connects the new node to the chain.
            rear.next = node;
        }

        // In both cases the new node is now the last one.
        rear = node;
        size++;
    }

    /**
     * Removes and returns the front element. O(1).
     * Throws IllegalStateException when the queue is empty (brief rule 4.1).
     */
    public T dequeue() {
        if (front == null) {
            // Failing loudly here means a bug in the turn order or a deck shows
            // up at the call that caused it, not later as a null player or card.
            // IllegalStateException is in java.lang, so it stays inside the
            // library limits (java.util.NoSuchElementException would not).
            throw new IllegalStateException("Cannot dequeue: the queue is empty.");
        }

        T data = front.data;

        // Move front one step back along the chain. The old first node is no
        // longer reachable from the queue, so it is gone.
        front = front.next;

        if (front == null) {
            // That was the last element. rear must be cleared too, otherwise
            // the next enqueue would link the new node behind a node that is
            // no longer in the queue, and front would stay null forever.
            rear = null;
        }

        size--;
        return data;
    }

    /**
     * Returns the front element without removing it. O(1).
     * Throws IllegalStateException when the queue is empty (brief rule 4.1).
     */
    public T peek() {
        if (front == null) {
            // Same rule as dequeue: an empty queue is never answered with null.
            throw new IllegalStateException("Cannot peek: the queue is empty.");
        }
        return front.data;
    }

    /** True when there is nothing to dequeue. O(1). */
    public boolean isEmpty() {
        return size == 0;
    }

    /** Number of elements. O(1), returns the counter. */
    public int size() {
        return size;
    }

import java.util.Random;
import java.util.Scanner;

/**
 * Starts everything (brief Section 5): adds players and runs the game.
 * It holds no game rules: it only builds the parts and hands them to Game.
 *
 * Run:  java Main [boardFile] [cardFile] [seed] [maxTurns]
 *   boardFile  default board.txt
 *   cardFile   default cards.txt
 *   seed       a whole number; the same seed gives the same dice and the same
 *              card order, so the same answers give the same game
 *   maxTurns   default 60 (rule 3.7)
 *
 * The loops here are allowed: Main runs before the game starts and is not
 * reached from any of the mandatory recursive methods.
 */
public class Main {

    public static void main(String[] args) {
        String boardFile = "board.txt";
        String cardFile = "cards.txt";
        if (args.length > 0) {
            boardFile = args[0];
        }
        if (args.length > 1) {
            cardFile = args[1];
        }

        // ONE Scanner on the keyboard for the whole program. Game reads the
        // buy answers from this same object; a second Scanner on System.in
        // would swallow input meant for the first.
        Scanner input = new Scanner(System.in);

        try {
            // One source of randomness for the shuffle, and the dice. With a
            // seed both are repeatable; without one every game is different.
            Random random;
            Dice dice;
            if (args.length > 2) {
                long seed = Long.parseLong(args[2]);
                random = new Random(seed);
                dice = new Dice(seed);
            } else {
                random = new Random();
                dice = new Dice();
            }

            // Files -> structures. Board builds the ring; CardLoader builds
            // each deck: ArrayList, one shuffle, then our LinkedQueue.
            Board board = new Board(boardFile);
            LinkedQueue<Card> chance = CardLoader.loadDeck(cardFile, "CHANCE", random);
            LinkedQueue<Card> community = CardLoader.loadDeck(cardFile, "COMMUNITY", random);

            Game game = new Game(board, chance, community, dice, new GameLogger(), input);
            if (args.length > 3) {
                game.setMaxTurns(Integer.parseInt(args[3]));
            }

            // 2 to 6 players, added in the order given: that is the turn order.
            int count = readPlayerCount(input);
            if (count == 0) {
                System.out.println("No players entered. The game was not started.");
                return;
            }
            String[] names = new String[count];
            for (int i = 0; i < count; i++) {
                names[i] = readName(input, i + 1, names);
                if (names[i] == null) {
                    System.out.println("Not enough player names. The game was not started.");
                    return;
                }
                game.addPlayer(names[i]);
            }

            // Turns until one player remains or the turn limit is reached,
            // then END and the ranking.
            game.play();

        } catch (IOException e) {
            System.out.println("Could not read a game file: " + e.getMessage());
        } catch (NumberFormatException e) {
            System.out.println("A number was expected (seed, max turns, or a number in a game file): " + e.getMessage());
        } catch (IllegalArgumentException e) {
            // Thrown by Board and CardLoader with a message naming the problem.
            System.out.println("Problem in a game file: " + e.getMessage());
        }
    }

    // Asks until the answer is a whole number from 2 to 6.
    // Returns 0 if the input ends first.
    private static int readPlayerCount(Scanner input) {
        while (true) {
            System.out.println("How many players? (2 to 6)");
            if (!input.hasNextLine()) {
                return 0;
            }
            String line = input.nextLine().trim();
            try {
                int count = Integer.parseInt(line);
                if (count >= 2 && count <= 6) {
                    return count;
                }
            } catch (NumberFormatException e) {
                // not a number: ask again
            }
            System.out.println("Please enter a number from 2 to 6.");
        }
    }

    // Asks until the name is usable: not empty, no | (it would break the log
    // format), and not already taken (the log identifies players by name).
    // Returns null if the input ends first.
    private static String readName(Scanner input, int number, String[] taken) {
        while (true) {
            System.out.println("Name of player " + number + "?");
            if (!input.hasNextLine()) {
                return null;
            }
            String name = input.nextLine().trim();
            boolean used = false;
            for (int i = 0; i < number - 1; i++) {
                if (taken[i].equalsIgnoreCase(name)) {
                    used = true;
                }
            }
            if (name.isEmpty() || name.contains("|")) {
                System.out.println("A name cannot be empty or contain |.");
            } else if (used) {
                System.out.println("That name is taken.");
            } else {
                return name;
            }
        }
    }

 * One cell of the board ring (brief Section 3: Node<T> with data, next, prev).
 *
 * Used by CircularDoublyLinkedList<T> only. LinkedQueue<T> has its own private
 * singly linked node, because the brief asks for a queue on singly linked nodes.
 *
 * This class holds three references and has no behaviour. Every link is written
 * by CircularDoublyLinkedList (addLast, insertAfter, remove), so the ring rule
 * "n.next.prev == n and n.prev.next == n" is kept in one class.
 */
public class Node<T> {

    // The payload. On the board T is Square, so this is the square a player
    // stands on. A player's position is a reference to this node (rule 4.2),
    // never an index, so everything a turn needs is reached through this field.
    T data;

    // The node one step forward. Board.step, ownsGroup, findByName and
    // findNearest all move by reading this field once per recursive call.
    // It is never null inside the ring: the last node's next is the head (GO),
    // which is what makes the board circular without any "% size".
    Node<T> next;

    // The node one step back. It lets remove(node) reach the previous
    // neighbour in O(1) instead of walking the ring, and it gives the list its
    // tail for free as head.prev, so addLast is O(1) with no tail field.
    Node<T> prev;

    // A new node starts unlinked. Leaving next and prev as null here is
    // deliberate: the list method that creates the node sets both links in the
    // same call, so there is one place to check when a link is wrong.
    Node(T data) {
        this.data = data;
        this.next = null;
        this.prev = null;
    }
}`},{name:"Player",file:"Player.java",lines:160,role:"One player: cash, position, owned squares, Jail state.",group:"support",extends:null,abstract:!1,fields:[{name:"STARTING_CASH",type:"int",vis:"public",static:!0,doc:"",value:"1500"},{name:"name",type:"String",vis:"private",static:!1,doc:"",value:""},{name:"cash",type:"int",vis:"private",static:!1,doc:"",value:""},{name:"position",type:"Node<Square>",vis:"private",static:!1,doc:`A reference to a node of the board ring, never an index (rule 4.2).

Node<Square> position, ArrayList<Square> owned, jailAttempts, jailFreeCards.`,source:`import java.util.ArrayList;

/**
 * Everything about one player (brief Section 5): name, cash,
 * Node<Square> position, ArrayList<Square> owned, jailAttempts, jailFreeCards.
 */
public class Player {

    public static final int STARTING_CASH = 1500; // rule 3.1

    private String name;

    private int cash;

    // A reference to a node of the board ring, never an index (rule 4.2).
    // The square is position.data; moving is following next or prev.
    private Node<Square> position;

    // ArrayList because Player.netWorth reads it by index: get(i) is constant
    // time here, while a linked list would walk from the start on every call.
    private ArrayList<Square> owned;

    // Failed rolls since entering Jail (0, 1 or 2). The third failure pays the fine.
    private int jailAttempts;

    // JAIL_FREE cards the player is holding. Our own queue: the cards are used
    // oldest first and each one goes back to a deck, which is queue behaviour.
    private LinkedQueue<Card> jailFreeCards;

    // Added fields: the two facts the turn loop tests on every turn.
    private boolean inJail;
    private boolean bankrupt;

    public Player(String name, Node<Square> start) {
        this.name = name;
        this.cash = STARTING_CASH;
        this.position = start; // the GO node (rule 3.1)
        this.owned = new ArrayList<Square>();
        this.jailAttempts = 0;
        this.jailFreeCards = new LinkedQueue<Card>();
        this.inJail = false;
        this.bankrupt = false;
    }

    public String getName() {
        return name;
    }

    // ---- cash ----

    public int getCash() {
        return cash;
    }

    // Signed change: positive for money received, negative for money paid.
    // It does not check for bankruptcy; Game's payment helper decides that
    // before it calls this, so the rule lives in one place.
    public void addCash(int change) {
        cash += change;
    }

    // ---- position ----

    public Node<Square> getPosition() {
        return position;
    }

    // Only two callers are allowed in the whole program: Game's move helper
    // (with the node Board.step returned) and Game's send-to-Jail helper.
    // Any other caller would let a player jump without walking the links.
    public void setPosition(Node<Square> position) {
        this.position = position;
    }

    // ---- owned squares ----

    public ArrayList<Square> getOwned() {
        return owned;
    }

    // Called by a square's land() right after it sets its owner to this player.
    public void addOwned(Square square) {
        owned.add(square);
    }

    // Empties the list in constant time by starting a new one. owned.clear()
    // loops inside the library, and this is reached from landOn (bankruptcy).
    public void resetOwned() {
        owned = new ArrayList<Square>();
    }

    /**
     * Mandatory recursive method (brief 5.1): the sum of purchase prices from
     * index to the end of the list. The caller starts at 0 and adds cash.
     * Base case: index is the list size, nothing left, 0.
     * Recursive case: this square's price plus the rest.
     * Stops because index rises by 1 each call and the list does not change.
     */
    public int netWorth(ArrayList<Square> owned, int index) {
        if (index >= owned.size()) {
            return 0;
        }
        return owned.get(index).getPrice() + netWorth(owned, index + 1);
    }

    // ---- Jail ----

    public boolean isInJail() {
        return inJail;
    }

    public int getJailAttempts() {
        return jailAttempts;
    }

    // Both ways of changing the Jail state reset the counter, so a later stay
    // in Jail can never start with attempts left over from an earlier one.
    public void enterJail() {
        inJail = true;
        jailAttempts = 0;
    }

    public void leaveJail() {
        inJail = false;
        jailAttempts = 0;
    }

    public void addJailAttempt() {
        jailAttempts++;
    }

    // ---- JAIL_FREE cards ----

    public boolean hasJailFreeCard() {
        return !jailFreeCards.isEmpty();
    }

    public void addJailFreeCard(Card card) {
        jailFreeCards.enqueue(card);
    }

    // Hands back the oldest card so Game can enqueue it on card.getDeck().
    // Check hasJailFreeCard() first: an empty queue throws.
    public Card useJailFreeCard() {
        return jailFreeCards.dequeue();
    }

    // ---- bankruptcy ----

    public boolean isBankrupt() {
        return bankrupt;
    }

    // One-way: a bankrupt player never returns. The game loop and the queue
    // rotation read this mark and simply do not enqueue the player again.
    public void markBankrupt() {
        bankrupt = true;
    }
}`},{name:"PropertySquare",file:"PropertySquare.java",lines:85,role:"A square you can buy. Rent doubles with the whole color group.",group:"square",extends:"Square",abstract:!1,fields:[{name:"color",type:"String",vis:"private",static:!1,doc:"Color group name from the board file. Board.ownsGroup compares it.",value:""},{name:"price",type:"int",vis:"private",static:!1,doc:"Purchase price: taken from the buyer's cash and counted in net worth.",value:""},{name:"rent",type:"int",vis:"private",static:!1,doc:"Base rent, before any doubling.",value:""},{name:"owner",type:"Player",vis:"private",static:!1,doc:`null means the bank holds it. This one reference is the whole ownership

    if (owner == null) {
        // Unowned. Only offer it when the player can pay, so buying can
        // never cause a bankruptcy.
        if (player.getCash() >= price && game.wantsToBuy(player, this)) {
            player.addCash(-price);
            // The next two lines must stay together: the square points to
            // its owner and the owner's list holds the square.
            owner = player;
            player.addOwned(this);
            game.logBuy(player, this);
        }
    } else if (owner != player) {
        // Owned by someone else. The lap for the color group starts at the
        // node the player is standing on, which holds this square.
        Node<Square> here = player.getPosition();
        int due = rent;
        if (game.getBoard().ownsGroup(here, here, color, owner)) {
            due = rent * 2;
        }
        // Game moves the money, so bankruptcy is decided in one place and
        // the RENT line is logged there. Jail does not stop rent (rule 3.4).
        game.payRent(player, owner, due);
    }
    // owner == player: nothing happens. Comparing references is constant
    // time; owned.contains(this) would be a hidden loop.
