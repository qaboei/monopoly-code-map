    if (owner == null) {
        // Unowned. Only offer it when the player can pay, so buying can
        // never cause a bankruptcy.
        if (player.getCash() >= price && game.wantsToBuy(player, this)) {
            player.addCash(-price);
            // The next two lines must stay together: the square points to
            // its owner and the owner's list holds the square.
            owner = player;
            player.addOwned(this);
            game.logBuy(player, this);
        }
    } else if (owner != player) {
        // Owned by someone else. The lap for the color group starts at the
        // node the player is standing on, which holds this square.
        Node<Square> here = player.getPosition();
        int due = rent;
        if (game.getBoard().ownsGroup(here, here, color, owner)) {
            due = rent * 2;
        }
        // Game moves the money, so bankruptcy is decided in one place and
        // the RENT line is logged there. Jail does not stop rent (rule 3.4).
        game.payRent(player, owner, due);
    }
    // owner == player: nothing happens. Comparing references is constant
    // time; owned.contains(this) would be a hidden loop.

 * A PROPERTY square: color, price, rent, owner (brief Section 5).
 * Rules 3.2 and 3.4: buy it if unowned, pay rent if someone else owns it,
 * nothing if you own it. Rent doubles when the owner holds the whole color group.
 */
public class PropertySquare extends Square {

    // Color group name from the board file. Board.ownsGroup compares it.
    private String color;

    private Player owner;

    public PropertySquare(String name, String color, int price, int rent) {
        super(name);
        this.color = color;
        this.price = price;
        this.rent = rent;
        this.owner = null;

    public void land(Game game, Player player) {
        if (owner == null) {
            // Unowned. Only offer it when the player can pay, so buying can
            // never cause a bankruptcy.
            if (player.getCash() >= price && game.wantsToBuy(player, this)) {

                // its owner and the owner's list holds the square.
                owner = player;
                player.addOwned(this);
                game.logBuy(player, this);

            // Owned by someone else. The lap for the color group starts at the
            // node the player is standing on, which holds this square.
            Node<Square> here = player.getPosition();
            int due = rent;
            if (game.getBoard().ownsGroup(here, here, color, owner)) {
                due = rent * 2;
            }
            // Game moves the money, so bankruptcy is decided in one place and
            // the RENT line is logged there. Jail does not stop rent (rule 3.4).
            game.payRent(player, owner, due);
        }
        // owner == player: nothing happens. Comparing references is constant
        // time; owned.contains(this) would be a hidden loop.
    }

    public String getType() {
        return "PROPERTY";
    }

    @Override
    public int getPrice() {
        return price;
    }

    public String getColor() {
        return color;
    }

    public int getRent() {
        return rent;

    public Player getOwner() {
        return owner;
    }

    public void setOwner(Player owner) {
        this.owner = owner;
    }

 * One square of the board (brief Section 5): a name and a landing rule.
 *
 * The five subclasses sit directly under this class, exactly as Section 5
 * draws them. Game never asks "which kind of square is this?"; it calls land()
 * and the subclass applies its own rule.
 */
public abstract class Square {

    // Unique on the board (Appendix B). Board.findByName compares it, and
    // every MOVE, BUY and RENT log line prints it.
    private String name;

    protected Square(String name) {
        this.name = name;
    }

    public String getName() {
        return name;
    }

    /**
     * Applies this square's rule to the player standing on it.
     * Called only by Game.landOn. Fixed by the brief.
     *
     * landOn is one of the mandatory recursive methods, so no land() body may
     * contain a loop: everything it does is constant time or recursive.
     */
    public abstract void land(Game game, Player player);

    /**
     * The type word used in the board file: GO, PROPERTY, TRANSIT, TAX,
     * CHANCE, COMMUNITY, JAIL, FREE or GO_TO_JAIL.
     * Board.findNearest compares this String, as its signature requires, so no
     * class outside the hierarchy needs instanceof.
     */
    public abstract String getType();

    /**
     * Purchase price. 0 for every square that cannot be bought; only
     * PropertySquare and TransitSquare override it. This lets Player.netWorth
     * add up a list of Square without casting.
     */
    public int getPrice() {
        return 0;
    }
}`},{name:"TaxSquare",file:"TaxSquare.java",lines:30,role:"Pay a fixed amount to the bank.",group:"square",extends:"Square",abstract:!1,fields:[{name:"amount",type:"int",vis:"private",static:!1,doc:"",value:""}],methods:[{name:"TaxSquare",key:"TaxSquare.TaxSquare",ctor:!0,sig:"public TaxSquare(String name, int amount)",vis:"public",static:!1,abstract:!1,returns:"",params:"String name, int amount",doc:"",line:9,end:12,code:`public TaxSquare(String name, int amount) {

public class TaxSquare extends Square {

    private int amount;

    public TaxSquare(String name, int amount) {
        super(name);
        this.amount = amount;
    }

    @Override
    public void land(Game game, Player player) {
        // The square only says how much. Game moves the money, because a tax
        // the player cannot afford is a bankruptcy with the bank as creditor.
        game.payTax(player, amount);
    }

    @Override
    public String getType() {
        return "TAX";
    }

    public int getAmount() {
        return amount;
    }

/**
 * A TRANSIT square: price, owner (brief Section 5).
 * Same three cases as a property, but rent = 25 x 2^(n - 1), where n is the
 * number of TRANSIT squares the owner holds (rule 3.2).
 */
public class TransitSquare extends Square {

    private int price;

    // null means the bank holds it.
    private Player owner;

    public TransitSquare(String name, int price) {
        super(name);
        this.price = price;
        this.owner = null;
    }

    @Override
    public void land(Game game, Player player) {
        if (owner == null) {
            if (player.getCash() >= price && game.wantsToBuy(player, this)) {
                player.addCash(-price);
                owner = player;
                player.addOwned(this);
                game.logBuy(player, this);
            }
        } else if (owner != player) {
            // n is at least 1 here, because the owner holds this square.
            int n = countTransit(owner.getOwned(), 0);
            game.payRent(player, owner, transitRent(n));
        }
    }

    /**
     * Mandatory recursive method (brief 5.1): returns 25 x 2^(owned - 1).
     * Base case: owned is 1 (or less), the rent is 25.
     * Recursive case: twice the rent for one fewer square.
     * Stops because owned drops by 1 each call until it reaches 1.
     */
    public int transitRent(int owned) {
        // "<= 1" and not "== 1": a call with 0 or a negative number would
        // otherwise never reach the base case.
        if (owned <= 1) {
            return 25;
        }
        return 2 * transitRent(owned - 1);
    }

    // Suggested helper. Counts the TRANSIT squares in a list from index to the
    // end. It is recursive because land() is reached from landOn, where loops
    // are not allowed. get(index) on an ArrayList is constant time.
    private int countTransit(ArrayList<Square> owned, int index) {
        if (index == owned.size()) {
            return 0;
        }
        int here = 0;
        if (owned.get(index).getType().equals("TRANSIT")) {
            here = 1;
        }
        return here + countTransit(owned, index + 1);
    }

    @Override
    public String getType() {
        return "TRANSIT";
    }

    @Override
    public int getPrice() {
        return price;
    }

    public Player getOwner() {
        return owner;
    }

    public void setOwner(Player owner) {
        this.owner = owner;
    }
}`}],links:[{from:"Board",to:"CardSquare",ext:!1,fields:[],calls:[["Board.makeSquare","CardSquare.CardSquare"]],creates:!0,mentions:!0},{from:"Board",to:"CircularDoublyLinkedList",ext:!1,fields:["squares"],calls:[["Board.Board","CircularDoublyLinkedList.size"],["Board.Board","CircularDoublyLinkedList.getHead"],["Board.Board","CircularDoublyLinkedList.addLast"],["Board.readExpansion","CircularDoublyLinkedList.getHead"],["Board.readExpansion","CircularDoublyLinkedList.size"],["Board.applyNextExpansion","CircularDoublyLinkedList.size"],["Board.applyNextExpansion","CircularDoublyLinkedList.insertAfter"],["Board.size","CircularDoublyLinkedList.size"]],creates:!1,mentions:!0},{from:"Board",to:"CornerSquare",ext:!1,fields:[],calls:[["Board.makeSquare","CornerSquare.CornerSquare"]],creates:!0,mentions:!0},{from:"Board",to:"LinkedQueue",ext:!1,fields:["expandSquares","expandAfter"],calls:[["Board.Board","LinkedQueue.isEmpty"],["Board.readExpansion","LinkedQueue.enqueue"],["Board.isPending","LinkedQueue.size"],["Board.isPending","LinkedQueue.dequeue"],["Board.isPending","LinkedQueue.enqueue"],["Board.hasExpansion","LinkedQueue.isEmpty"],["Board.applyNextExpansion","LinkedQueue.dequeue"]],creates:!1,mentions:!0},{from:"Board",to:"Node",ext:!1,fields:["goNode","jailNode"],calls:[],creates:!1,mentions:!0},{from:"Board",to:"Player",ext:!1,fields:[],calls:[["Board.step","Player.addCash"]],creates:!1,mentions:!0},{from:"Board",to:"PropertySquare",ext:!1,fields:[],calls:[["Board.makeSquare","PropertySquare.PropertySquare"],["Board.ownsGroup","PropertySquare.getColor"],["Board.ownsGroup","PropertySquare.getOwner"]],creates:!0,mentions:!0},{from:"Board",to:"Square",ext:!1,fields:["squares","goNode","jailNode","expandSquares"],calls:[["Board.Board","Square.getName"],["Board.readExpansion","Square.getName"],["Board.isPending","Square.getName"],["Board.applyNextExpansion","Square.getName"],["Board.ownsGroup","Square.getType"],["Board.findByName","Square.getName"],["Board.findNearest","Sq
