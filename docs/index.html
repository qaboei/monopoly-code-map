    String line = in.readLine();
    while (line != null) {

        if (line.startsWith("EXPAND|")) {
            // Twist T3: not part of the starting board. Checked now, kept
            // for later.
            try {

            } catch (IllegalArgumentException e) {

            if (!expandSquares.isEmpty()) {
                in.close();
                throw new IllegalArgumentException("Board file: EXPAND lines must come after every square line.");

            // first match, so a second square with the same name could

            // ring built so far; no extra collection is needed.

            squares.addLast(square);

            // The node just added is the tail, which is head.prev.
            Node<Square> node = squares.getHead().prev;

                    in.close();

        node.next = node;

        // New node first: these two writes cannot break the ring, because
        // nothing in the ring points to the new node yet.
        node.prev = tail;
        node.next = head;

        // Then the two neighbours. After these the ring rule holds again
